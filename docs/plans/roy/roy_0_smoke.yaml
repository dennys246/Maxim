# Roy-0 smoke iteration — methodology validation, NOT a persona run.
#
# Purpose: end-to-end exercise of the Roy harness (R1 curriculum runner +
# R2 substrate diff + R3 three-arm runner + R4 iteration-log generator)
# at the smallest scale where every code path fires at least once. The
# findings from running this spec are about the HARNESS, not about
# persona emergence. We expect substrate divergence between A and B/C
# at this scale because A inherits priming substrate that B/C do not;
# we do NOT expect or claim persona convergence — 50 priming turns is
# orders of magnitude below the threshold persona_convergence_crucible.md
# §"Roy-1: Adversarial" calls out.
#
# Run with:
#   maxim roy run docs/plans/roy/roy_0_smoke.yaml --dry-run    # parse-only
#   maxim roy run docs/plans/roy/roy_0_smoke.yaml              # real
#
# Expected wall time: ~10 minutes on the dev laptop (substrate-primary
# AUT means no LLM in the AUT loop; the orchestrator still calls the
# LLM for narration which is silenced into /dev/null on the bridge side
# per the substrate-primary narration suppression).
#
# Findings are appended to docs/plans/deferred/persona_convergence_crucible.md
# §"Iteration log" via `maxim roy log roy-0-smoke` after the run.

name: roy-0-smoke
description: |
  Methodology smoke for the Roy harness. 50 turns of cradle_prelinguistic
  priming (5 stages × 10 turns) feeds arm A; arms B and C run the
  10-turn held-out test from blank substrate. The test scenario
  deliberately re-uses cradle_prelinguistic — arm A should show
  episode/NAc carryover from priming, B and C should not. Roy-0
  findings characterise the harness, not a persona.

embodiment: bodies/infant_humanoid
aut_mode: substrate-primary

# Priming: chained substrate-primary cradle, 50 turns total. Five
# stages of 10 turns each, all using the same arc — this is the
# simplest curriculum shape that still exercises R1's resume_session
# chaining (5 stage handoffs).
priming:
  name: roy-0-smoke-priming
  embodiment: bodies/infant_humanoid
  aut_mode: substrate-primary
  stages:
    - name: act1_neonatal_a
      arc: cradle_prelinguistic
      turns: 10
    - name: act1_neonatal_b
      arc: cradle_prelinguistic
      turns: 10
    - name: act2_primary_circular_a
      arc: cradle_prelinguistic
      turns: 10
    - name: act2_primary_circular_b
      arc: cradle_prelinguistic
      turns: 10
    - name: act3_secondary_circular
      arc: cradle_prelinguistic
      turns: 10

# Held-out test scenario — deliberately overlaps with priming so arm
# A can demonstrate carryover. Real Roy iterations swap in a fixture
# with novel + familiar + unrelated stimuli per the methodology.
test_scenario:
  fixture: ../../../scenarios/cradle/warmup.yaml
  turns: 10

arms:
  a:
    substrate: from_priming
    # Neutral system prompt — arm A's persona emerges from substrate,
    # not from prompt injection.
    system_prompt: neutral
  b:
    substrate: blank
    # Deliberately vague prompt — Roy-0 is NOT testing persona,
    # just the prompt-injection arm of the runner. Real personas
    # (Roy-1: adversarial, Roy-2: cautious-scout, ...) carry
    # carefully-shaped prompts.
    system_prompt: "You are a hungry infant"
  c:
    substrate: blank
    system_prompt: neutral
