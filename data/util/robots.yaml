# Robot Configuration
# Configure multiple robots for coordinated operation.
#
# Each robot needs:
#   - type: Controller type ("reachy_mini" or "simulated")
#   - primary: Whether this is the primary robot (only one should be true)
#   - config: Type-specific configuration
#
# Optional embodiment (opt-in):
#   - config.body: a SEM body component ref (e.g. "bodies/reachy_mini"). When
#     set, the live runtime wires that body into the executor — drives drift,
#     evaluate_failures() publishes pain, and the body's affordance tools are
#     available. Omit it (the default) to run bodiless. This is the same ref
#     form the `--embodiment` CLI flag takes.
#
# Example with multiple Reachy Minis:
#
# robots:
#   reachy_primary:
#     type: reachy_mini
#     primary: true
#     config:
#       robot_name: reachy_mini
#       media_backend: default
#       timeout: 30.0
#       body: bodies/reachy_mini   # opt-in: wire the SEM body
#
#   reachy_secondary:
#     type: reachy_mini
#     primary: false
#     config:
#       robot_name: reachy_mini_2
#       media_backend: default
#       timeout: 30.0
#
# For testing without hardware:
#
# robots:
#   simulated:
#     type: simulated
#     primary: true
#     config:
#       video_resolution: [640, 480]
#       simulate_delays: false

# Default configuration: single Reachy Mini
robots:
  primary:
    type: reachy_mini
    primary: true
    config:
      robot_name: reachy_mini
      media_backend: default
      timeout: 30.0
