name: hippocampal_recall_medium
description: |
  Research experiment: Hippocampus associative recall under narrative interference.

  Condition: MEDIUM (6 interference turns).
  Same seed and recall phases as the short variant, but with 6 unrelated
  encounters between them. Tests whether recall degrades when the associative
  graph has more competing nodes and the seed memory is pushed further from
  the short-term buffer.

  Seed detail: The name "Verath" (door password).

timing: step_based

percepts:
  # ── Act 1: The Warning (Seed Phase) ──────────────────────────────
  - at: 0
    source: cli
    cli_input: |
      You are Aric, a wandering ranger. You arrive at the village of
      Thornhaven at dusk. As you pass the herbalist's shop, an old woman
      named Elara grabs your arm. Her eyes are wide with fear.

      "You're heading to the Thornwood, aren't you?" she whispers.
      "Listen carefully. The door beneath the silver elm — it answers
      only to one name: Verath. Say it clearly, or you'll never pass.
      Remember this. Verath."

      She presses a dried moonpetal flower into your hand and retreats
      inside. What do you do?
    salience: 1.0
    novelty: 1.0
    metadata:
      scenario_tag: seed_password
      phase: "act1_warning"
      experiment_role: seed
      critical_detail: "Verath"

  - at: 1
    source: cli
    cli_input: |
      Elara glances out her window nervously. "One more thing," she
      calls after you. "Don't trust the miller — he reports to them."
      She closes the shutters. The village square is quiet. Night is
      falling. You should move on toward the Thornwood.
    salience: 0.7
    novelty: 0.5
    metadata:
      scenario_tag: seed_reinforcement
      phase: "act1_warning"
      experiment_role: seed_context

  # ── Act 2: The Journey (Interference Phase — 6 encounters) ──────
  - at: 3
    source: cli
    cli_input: |
      Dawn. You've left Thornhaven behind. The road leads through
      Blackwater Marsh — a flat expanse of reeds and stagnant water.
      A ferryman named Grul blocks the only crossing, a flat barge
      chained to a post.

      "Coin or riddle," he grunts. "Your choice."
    salience: 0.6
    novelty: 0.7
    metadata:
      scenario_tag: interference_1
      phase: "act2_journey"
      experiment_role: interference

  - at: 5
    source: cli
    cli_input: |
      Past the marsh, the forest road narrows. Three bandits drop from
      the trees — a woman with a crossbow, a scarred man with a club,
      and a nervous teenager with a knife.

      "Purse. Now." the woman says. The teenager's hands are shaking.
      You're surrounded.
    salience: 0.8
    novelty: 0.6
    metadata:
      scenario_tag: interference_2
      phase: "act2_journey"
      experiment_role: interference

  - at: 7
    source: cli
    cli_input: |
      You reach the mountain pass by midday. A traveling merchant with
      a mule train waves you down. "Careful on the north road," she
      says. "Mines are closed — something about cave-ins. Or worse."
      She offers dried meat and rope in exchange for news.
    salience: 0.5
    novelty: 0.5
    metadata:
      scenario_tag: interference_3
      phase: "act2_journey"
      experiment_role: interference

  - at: 9
    source: cli
    cli_input: |
      A collapsed bridge forces a detour through a cave system. The
      entrance is wide enough for two abreast, but quickly narrows.
      Strange markings cover the walls — concentric spirals that seem
      to shift when you look away. Water drips in the distance.
      Which way do you go?
    salience: 0.6
    novelty: 0.7
    metadata:
      scenario_tag: interference_4
      phase: "act2_journey"
      experiment_role: interference

  - at: 11
    source: cli
    cli_input: |
      Deep in the caves, you find a wounded scout propped against a
      stalagmite. She's bleeding from a leg wound but lucid. "Army,"
      she rasps. "Beyond the mountains. Hundreds of them. They'll
      come through the pass within the week." She asks for water
      and bandaging.
    salience: 0.7
    novelty: 0.6
    metadata:
      scenario_tag: interference_5
      phase: "act2_journey"
      experiment_role: interference

  - at: 13
    source: cli
    cli_input: |
      You emerge from the caves into fading twilight and make camp
      by a stream. As you tend the fire, a fox approaches — russet
      fur, bright eyes, oddly unafraid. It sits across the fire and
      watches you eat, head tilted. It almost seems to understand
      when you speak.
    salience: 0.5
    novelty: 0.6
    metadata:
      scenario_tag: interference_6
      phase: "act2_journey"
      experiment_role: interference

  # ── Act 3: The Door (Recall Phase) ──────────────────────────────
  - at: 15
    source: cli
    cli_input: |
      The Thornwood is silent. After hours of walking beneath ancient
      oaks, you find it — a massive silver elm, its bark gleaming
      faintly in the half-light. At its base, half-hidden by gnarled
      roots, is a stone door. No handle. No keyhole. Just a carved
      face with an open mouth that seems to be waiting for something.

      The door will not yield to force. What do you do?
    salience: 0.9
    novelty: 0.8
    metadata:
      scenario_tag: recall_challenge
      phase: "act3_door"
      experiment_role: recall_target
      expected_recall: "Verath"

  # ── Epilogue ────────────────────────────────────────────────────
  - at: 17
    source: cli
    cli_input: |
      The adventure concludes. Reflect on your journey from Thornhaven
      to this moment. What do you remember most vividly? Were there
      details you almost forgot? What stayed with you?
    salience: 0.4
    novelty: 0.3
    metadata:
      scenario_tag: debrief
      phase: "epilogue"
      experiment_role: self_report

expectations:
  - type: memory_formed
    memory_contains: "Verath"
    description: "Hippocampus captured the password from Elara's warning"

  - type: pipeline_continued
    after_tag: interference_6
    description: "Pipeline continues through all 6 interference encounters"

  - type: action_taken
    tool: RespondTool
    description: "Agent attempts to interact with the door"

  - type: action_count_range
    description: "Agent takes 7-40 actions across the campaign"
    params:
      min: 7
      max: 40
