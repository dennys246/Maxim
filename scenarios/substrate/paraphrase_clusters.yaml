# Substrate P0 — Research-Grade Paraphrase Cluster Fixtures
#
# 55 clusters, 2-3 paraphrases each (155 sentences total).
# 60/40 train/holdout split: split=train or split=holdout in metadata.
# Ground truth: cluster field in metadata identifies the referent.
#
# Design criteria:
#   - Lexically different but semantically equivalent within clusters
#   - Near-miss distractors that share vocabulary across clusters
#   - Difficulty gradient: easy (obvious rewordings) to hard (requires
#     understanding intent, not just word overlap)
#   - Topics: daily life, science, technology, emotions, spatial,
#     temporal, abstract concepts, commands/requests
#
# Scoring: a baseline that clusters by surface similarity (cosine on
# sentence embeddings) should get 60-85%. Below 60% = fixtures too hard.
# Above 85% = fixtures too easy for substrate testing.

name: paraphrase_clusters_v1
description: |
  Research-grade paraphrase cluster fixtures for substrate P0 pilot.
  55 clusters × 2-3 paraphrases = 155 sentences. Used to calibrate
  fixture difficulty before P1 implementation begins.

