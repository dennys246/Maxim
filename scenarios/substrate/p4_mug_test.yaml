# P4 Stage 2 v2 — Cross-modal mug test fixture descriptor
#
# **v2 change-fixture commit (2026-04-15):** fixture_version bumped
# from 1 to 2 to add the canonical ship-shape BuildConfig parameters
# (build_noise_reps + build_bridges_enabled). Stage 2 v1 hard-coded
# these in scripts/p4_mug_test_sweep.py as module-level constants;
# Round 2 Arch #5 review caught them as entangled with the fixture
# SHA pin and Stage 3 Arm B/C blocker. v2 moves them into the
# fixture descriptor so the SHA pin covers the full canonical ship
# shape (10 classes + sample indices + build parameters), and Stage
# 3 arms can override them via BuildConfig without breaking the v1
# SHA pin. Selected operating point: noise_reps=1 + bridges=shared
# from the Phase 2D v2 sweep — see docs/experiments/p4_mug_test_sweep_v2.md.
#
# 10 flower classes × 5 samples each = 50 base (text_concept, image)
# pairs. Classes selected by scripts/p4_clip_calibration_sweep.py —
# each lands in CLIP's [0.50, 0.85] zero-shot accuracy headroom band
# so Stage 3's OpenCLIP head-to-head has meaningful signal on both
# sides.
#
# Total episodes after noise + bridge layers:
#   50 class episodes (5 per class × 10 classes)
# + 10 noise episodes (noise_reps=1 × 10 classes × 1 pair each)
# + 10 bridge text-text episodes (text_X → text_flower × 10)
# + 10 bridge text-vision episodes (text_flower → vision_X_0 × 10)
# = 80 total episodes
#
# **DO NOT EDIT CLASS NAMES, SAMPLE INDICES, OR BUILD PARAMETERS.**
# The fixture is pinned as a SHA-256 hash in
# tests/substrate/p4_fixture_loader.py::FIXTURE_SHA256. Any edit
# without an explicit `change-fixture` commit message + hash bump
# will fail CI. See the "no band-aid fixture tweaks" rule in
# docs/experiments/p4_clip_calibration.md.
#
# Each sample_indices list is the first 5 images of that class in
# torchvision.datasets.Flowers102(split="test") iteration order.
# Deterministic — regenerated only by an explicit recalibration
# sweep, not by drive-by edits.

fixture_version: 2
dataset: torchvision.datasets.Flowers102  # upgraded from Stage 2 v1's stale nelorth label
split: test
samples_per_class: 5
total_pairs: 50

# Stage 2 v2 canonical ship-shape BuildConfig parameters.
#
# These are consumed by tests/substrate/p4_build_and_bind.py via
# the BuildConfig loaded from load_fixture_descriptor(). Stage 3
# Arm B/C runners can override them via explicit BuildConfig
# arguments without touching this file.
#
# build_noise_reps=1: each class gets 1 cross-class contamination
#   pair reinforced 1× → weight 0.3. Combined with the 5×
#   class-correct reinforcement → weight 0.7, the substrate's
#   ranker has a signal/noise weight ratio of ~1.75 to work with.
# build_bridges_enabled=true: adds a text_flower superclass node
#   bound to every class's text + first vision via separate
#   episodes. Creates 2-hop paths text_X → text_flower → vision_Y_0
#   that are blocked under Stage 1's single-hop retrieve_cross_modal
#   filter but reachable under Option 2's split filter.
#
# Operating point selected from the Phase 2D v2 12-combination
# sweep via the rule "largest noise_reps at which bridge-enabled
# mean forward top-5 recall ≥ 0.90" (user-chosen tighter threshold).
# At noise_reps=1: mean recall 0.980, Option 2 lift +96.0%.
# At noise_reps=2: mean recall drops to 0.800 (fails the 0.90 bar).
build_noise_reps: 1
build_bridges_enabled: true
build_text_ec_threshold: 0.60
build_vision_ec_threshold: 1.01

classes:
