# P4 Stage 2 — Cross-modal mug test fixture descriptor
#
# 10 flower classes × 5 samples each = 50 (text_concept, image) pairs.
# Classes selected by scripts/p4_clip_calibration_sweep.py — each lands
# in CLIP's [0.50, 0.85] zero-shot accuracy headroom band so Stage 3's
# OpenCLIP head-to-head has meaningful signal on both sides.
#
# **DO NOT EDIT CLASS NAMES OR SAMPLE INDICES.** The fixture is pinned
# as a SHA-256 hash in tests/substrate/p4_fixture_loader.py::FIXTURE_SHA256.
# Any edit without an explicit `change-fixture` commit message + hash
# bump will fail CI. See the "no band-aid fixture tweaks" rule in
# docs/plans/substrate_p4_cross_modal_binding.md.
#
# Each sample_indices list is the first 5 images of that class in
# torchvision.datasets.Flowers102(split="test") iteration order.
# Deterministic — regenerated only by an explicit recalibration
# sweep, not by drive-by edits.
#
# The v2 noise/bridge build parameters that were briefly in this file
# (build_noise_reps, build_bridges_enabled, build_*_ec_threshold) have
# been removed — the v2 measurement they served was withdrawn as
# tautological. See docs/experiments/p4_stage2_v2_post_mortem.md.
# The next Option 2 measurement attempt will define its own fixture
# shape on a fresh branch.

fixture_version: 1
dataset: torchvision.datasets.Flowers102
split: test
samples_per_class: 5
total_pairs: 50

classes:
