    source: cli
    cli_input: "Waves crashed loudly against the rocky shoreline."
    metadata: { cluster: ocean_wave, role: target }
  - at: 10
    source: cli
    cli_input: "The surf pounded the beach with white foam and spray."
    metadata: { cluster: ocean_wave, role: target }
  - at: 11
    source: cli
    cli_input: "Tide rolled in fast, breaking hard on the sand."
    metadata: { cluster: ocean_wave, role: target }

  # ── Target cluster 5: garden_bloom ───────────────────────────────
  - at: 12
    source: cli
    cli_input: "Spring flowers opened across the whole garden today."
    metadata: { cluster: garden_bloom, role: target }
  - at: 13
