# Substrate P2 — Reward-Modulated Recognition Fixture
#
# 10 clusters × 3 paraphrases = 30 sentences, designed to produce
# measurable fragmentation at threshold=0.50 (stricter than P1's 0.40)
# so the reward-bias pathway has room to demonstrate collapse.
#
# Target clusters receive a reward event after the first encoded
# sentence. The bias widens EC's recognition radius around the
# rewarded node, and subsequent paraphrases should complete to it
# instead of separating.
#
# Distractor clusters receive no reward — they exist to verify
# non-interference: the bias on target nodes must not bleed into
# distractor-cluster recognition.
#
# Design criteria:
#   - Lexical diversity within clusters (not trivial rewordings) so
#     threshold=0.50 produces baseline fragmentation
#   - Distractors share some vocabulary with targets to stress-test
#     non-interference
#   - Near-miss target paraphrases that flip from separate → collapse
#     under reward bias

name: p2_reward_modulation_v1
description: |
  P2 reward-modulated recognition fixture. 10 clusters, 5 target + 5
  distractor. Injects reward after first sentence of each target
  cluster; distractor clusters receive no reward. Validates the
  rewarded-collapse ≥30% / distractor-interference ≤5% criteria.

timing: step_based

reward_schedule:
  reward: 1.0
  targets:
    - morning_coffee
    - sunset_view
    - bookstore_visit
    - ocean_wave
    - garden_bloom

percepts:
  # ── Target cluster 1: morning_coffee ─────────────────────────────
  - at: 0
    source: cli
    cli_input: "I had a hot coffee this morning to wake up."
    metadata: { cluster: morning_coffee, role: target }
  - at: 1
    source: cli
    cli_input: "My morning started with a strong espresso to get going."
    metadata: { cluster: morning_coffee, role: target }
  - at: 2
    source: cli
    cli_input: "Brewed a fresh cup at breakfast to shake off sleep."
    metadata: { cluster: morning_coffee, role: target }

  # ── Target cluster 2: sunset_view ────────────────────────────────
  - at: 3
    source: cli
    cli_input: "The sunset painted the sky in orange and pink tonight."
    metadata: { cluster: sunset_view, role: target }
  - at: 4
    source: cli
    cli_input: "Watched the sun go down and the clouds turn red."
    metadata: { cluster: sunset_view, role: target }
  - at: 5
    source: cli
    cli_input: "Evening light turned the horizon into warm colors."
    metadata: { cluster: sunset_view, role: target }

  # ── Target cluster 3: bookstore_visit ────────────────────────────
  - at: 6
    source: cli
    cli_input: "I spent hours browsing novels at the local bookstore."
    metadata: { cluster: bookstore_visit, role: target }
  - at: 7
    source: cli
    cli_input: "Wandered the aisles of a bookshop looking at fiction."
    metadata: { cluster: bookstore_visit, role: target }
  - at: 8
    source: cli
    cli_input: "Picked up a few paperbacks from the store downtown."
    metadata: { cluster: bookstore_visit, role: target }

  # ── Target cluster 4: ocean_wave ─────────────────────────────────
