# Substrate P2 — Reward-Modulated Recognition Fixture
#
# 10 clusters x 5 paraphrases = 50 sentences, selected for pairwise
# semantic distance in paraphrase-mpnet-base-v2 embedding space. Target
# clusters were selected from a solo-target probe that identified which
# clusters respond cleanly to reward modulation without cross-cluster
# contamination (Stage 3 methodology, 2026-04-14).
#
# Design criteria (Stage 3 revision, 2026-04-14):
#
#   - 5 targets + 5 distractors, all pairwise semantically distant in
#     mpnet space. Pre-Stage-3 drafts used "pleasant daily scenes" as
#     targets (morning_coffee, sunset_view, bookstore_visit, ocean_wave,
#     garden_bloom) which mpnet treated as moderately close; reward
#     bias widening one target pulled the others into the same node,
#     destroying plurality ownership.
#
#   - Each target cluster comes from a DIFFERENT domain:
#       bookstore_visit  - reading/literature
#       ocean_wave       - nature/physical/water
#       garden_bloom     - nature/botanical
#       laptop_repair    - technology/hardware failure
#       chess_game       - game/strategy/abstract
#
#   - Each distractor cluster comes from a non-overlapping domain:
#       weather_forecast - meteorology
#       email_inbox      - communications
#       piano_practice   - music/skill
#       house_cleaning   - domestic chores
#       dental_visit     - health/medical
#
#   - 5 sentences/cluster = 10 within-cluster pairs each, giving
#     per-cluster self-collapse rates in {0, 0.1, ..., 1.0}.
#
#   - Paraphrase difficulty tiers: sentences 0-1 are close paraphrases;
#     sentences 2-4 are harder rewordings with low lexical overlap.
#     The mechanism must use reward bias to collapse the hard
#     paraphrases onto the cluster's home node.
#
# Target clusters receive one reward event after the first encoded
# sentence. Distractor clusters receive no reward. The p2_metrics
# plurality-ownership self-collapse metric
# (tests/substrate/p2_metrics.py) measures per-cluster self-collapse
# rate (a pair "collapses" only if both sentences map to the same
# node AND that node is plurality-owned by the cluster). This
# correctly attributes reward-bias wins to the cluster that actually
# benefits, and correctly penalizes cross-cluster contamination.

name: p2_reward_modulation_v3
description: |
  P2 reward-modulated recognition fixture, Stage 3 revision.
  10 pairwise-distant clusters, 5 targets + 5 distractors, 5 sentences each.
  Plurality-ownership self-collapse metric (baseline vs rewarded).
  Validates target_success_rate >=80%, distractor_drift <=5 pp,
  target_monotone_fraction >=80%.

timing: step_based

reward_schedule:
  reward: 2.0
  targets:
    - bookstore_visit
    - ocean_wave
    - garden_bloom
    - laptop_repair
    - chess_game

