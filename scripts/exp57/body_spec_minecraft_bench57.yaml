# The `body:`-rooted export spec for Exp 57 bundle composition
# (`maxim substrate export --body-yaml <this file>`): `load_spec` reads THIS
# shape, not component YAMLs, and `derive_capability_map` runs the real
# tool-naming path over it so the manifest's capability_map carries the
# `tool:minecraft_bench57_aff_*` keys the Exp 57 donors' biases key on, and the
# bundle's `body_ref` records the REAL apparatus body (minecraft_bench57) — not
# minecraft_bench (the provenance/gate-7 fix; see the code-lens finding). Mirrors
# `src/maxim/_data/components/bodies/minecraft_bench57.yaml` EXACTLY on entity
# name, modulator, and affordance names — a guard test pins the two files'
# affordance sets equal so they cannot drift. Affordances are identical to
# minecraft_bench (aff_a..aff_h); only the entity NAME differs (which is what
# body_ref stamps), and the difference from bench is the offsets-only WORLD
# channel, which the export path does not read.
body:
  name: minecraft_bench57
  entity_type: body
  modulators:
    act:
      abstract: true
      affordances:
        aff_a: {params: {}, description: "Perform action a."}
        aff_b: {params: {}, description: "Perform action b."}
        aff_c: {params: {}, description: "Perform action c."}
        aff_d: {params: {}, description: "Perform action d."}
        aff_e: {params: {}, description: "Perform action e."}
        aff_f: {params: {}, description: "Perform action f."}
        aff_g: {params: {}, description: "Perform action g."}
        aff_h: {params: {}, description: "Perform action h."}
