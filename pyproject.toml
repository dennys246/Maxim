[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pymaxim"
version = "1.1.4"
description = "Bio-inspired LLM agent harness with embodied sensation, homeostatic drives, and experience-grounded persistent context across sessions without fine-tuning."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "Denny Schaedig"}]
keywords = [
    "cognitive-architecture",
    "bio-inspired",
    "llm-agents",
    "embodied-ai",
    "sensorimotor",
    "memory-systems",
    "reinforcement-learning",
    "robotics",
    "simulation",
    "homeostasis",
    "pain-learning",
    "cross-session-learning",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]

dependencies = [
    "numpy>=1.26,<3.0",
    "scipy>=1.11,<2.0",
    "pyyaml>=6.0,<7.0",
    "json-repair>=0.30,<1.0",
    "httpx>=0.27,<1.0",
    "rich>=13.0.0,<14.0",
    # Plan 4 C2: cross-platform RMW file locking for drain state
    # serialization. Already present transitively via huggingface_hub /
    # torch on most installs; explicit here so headless peers without
    # either optional extra still get it. POSIX fcntl + Windows
    # msvcrt wrapped under one API.
    "filelock>=3.0,<4.0",
]

[project.urls]
Homepage = "https://pymaxim.bio"
Documentation = "https://pymaxim.bio/getting-started/"
Repository = "https://github.com/dennys246/Maxim"
Issues = "https://github.com/dennys246/Maxim/issues"

[project.optional-dependencies]
# Vision perception (OpenCV + ONNX Runtime)
vision = [
    "opencv-python>=4.12,<5.0",
    "onnxruntime>=1.20,<2.0",
]
# Audio perception (Whisper + ctranslate2)
audio = [
    "faster-whisper>=1.1.1",
    "ctranslate2>=4.6.0",
    "av>=14.0.0",
]
# Reachy Mini robot hardware
# NOTE: reachy-mini declares NO `gstreamer` extra (verified against PyPI metadata:
# its extras are all/examples/mujoco/nn-kinematics/opencv/placo-kinematics/rerun/
# wireless-version). The old `[gstreamer]` marker was a silent no-op — pip warns
# and ignores an unknown extra. On Linux the SDK uses system GStreamer via
# PyGObject (`gstreamer-bundle` is gated `sys_platform != "linux"`).
reachy = [
    "reachy-mini>=1.8.3,<2.0",
]
# Web search
search = [
    "ddgs>=6.0.0",
]
# Local Console web UI backend (`maxim serve`) — FastAPI auto-emits the OpenAPI
# facade contract the maxim-pulse frontend generates its FacadeClient from.
console = [
    "fastapi>=0.110,<1.0",
    "uvicorn>=0.29,<1.0",
]
# Training support (MotorCortex model training)
training = [
    "tensorflow>=2.20,<3.0",
    "keras>=3.13,<4.0",
]
# llama.cpp backend (CPU/GPU via llama-cpp-python)
llm-llama = [
    "llama-cpp-python>=0.3.8",
]
# Host a local llama-cpp-server + speak to any OpenAI-compatible endpoint.
# Required for multi-LLM Phase 6 (local auto-spawn) and Phase 4 remote lanes.
llm-server = [
    "llama-cpp-python>=0.3.8",
    "sse-starlette>=1.6.0",
    "uvicorn>=0.22.0",
    "fastapi>=0.100.0",
    "pydantic-settings>=2.0.0",
    "starlette-context>=0.3.6",
    "openai>=1.0.0",
    "tiktoken>=0.7.0",
]
# PyTorch/Transformers backend (for Blackwell GPU support)
# NOTE: Blackwell (RTX 50 series, sm_120) requires torch>=2.7 built against CUDA 12.8.
# Install with: pip install torch>=2.7 --index-url https://download.pytorch.org/whl/cu128
llm-torch = [
    "torch>=2.7",
    "transformers>=4.40.0",
    "accelerate>=0.27.0",
    "bitsandbytes>=0.43.0",
    "sentencepiece>=0.2.0",
    "huggingface-hub>=0.24.0",
]
llm-anthropic = [
    "anthropic>=0.40.0",
]
llm-openai = [
    "openai>=1.0.0",
    "tiktoken>=0.7.0",
]
# Floor is 1.3.0, NOT 1.2.0: 1.2.0 ships no aarch64 wheel (and needs
# piper-phonemize); 1.3.0+ has a cp39-abi3 aarch64 wheel with espeak-ng bundled.
tts = [
    "piper-tts>=1.3.0",
]
# YOLOv8 vision backend (AGPL-3.0 — NOT included in core to keep Apache-2.0 clean)
# Bounded to 8.x so security patches flow through; pin major to catch breaking
# changes proactively. lap is also bounded similarly.
yolo = [
    "ultralytics>=8.3.248,<9.0",
    "lap>=0.5.12,<1.0",
]
# Twilio SMS/Voice communication
comms = [
    "twilio>=9.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.24.0",
]
# Phase 4: Neural semantic similarity (requires torch).
# ⚠️ NOT for aarch64/Pi. torch >= 2.11 DROPPED the `platform_machine == "x86_64"`
# guard on its CUDA deps, so on aarch64 it now pulls cuda-toolkit + nvidia-* +
# triton (~2.4GB of libraries a Pi can never execute) — measured. Use the `pi`
# extra there and place the encoder on the leader; if you genuinely need torch
# on ARM, install it from the CPU index first:
#   pip install torch --index-url https://download.pytorch.org/whl/cpu
semantic = [
    "sentence-transformers>=2.2.0",
    "torch>=2.1",
    "spacy>=3.7",
]
# Temporal reference parsing for natural language time extraction
temporal = [
    "dateparser>=1.2.0",
]
# Database backend for Mother Maxim (PostgreSQL + pgvector)
database = [
    "psycopg[binary]>=3.1",
    "pgvector>=0.3",
]
# Lean aarch64 / Raspberry Pi PEER install (the PKG seam).
#
# The Pi is a sensor/actuator client: LLM inference is REMOTE (mesh → the
# owner's leader) through `_MaximPeerBackend`, which uses only core deps
# (httpx via utils/http.py) — so NO llm-* extra is required for the mesh
# branch. `llm-anthropic` is included because the setup wizard also offers a
# CLOUD branch, and it is a small pure-Python client.
#
# DELIBERATELY EXCLUDED:
#   * semantic / llm-torch — torch is a ~450MB runtime floor on the Pi (FIT,
#     docs/embodiment/reachy_mini/fit_runbook.md). The encoder belongs on the
#     leader (perception_pipeline_placement.md); without it the substrate
#     degrades to the documented bag-of-words fallback rather than failing.
#   * llm-llama / llm-server — no local inference on the peer.
#   * training (tensorflow), yolo (AGPL), database, comms, search, temporal.
#
# `console` is listed explicitly rather than relying on reachy-mini pulling
# fastapi/uvicorn transitively — that is an accident, not a contract.
#
# SYSTEM PREREQUISITE (not expressible in pip metadata): on Linux,
# `reachy-mini` requires PyGObject, which is SDIST-ONLY on PyPI, so pip
# compiles it. A bare Pi needs the build inputs first:
#   sudo apt install python3-gi libgirepository1.0-dev libcairo2-dev pkg-config
# See docs/embodiment/reachy_mini/pi_install.md.
pi = [
    "pymaxim[reachy,console,llm-anthropic,tts]",
]
# Everything except AGPL-licensed yolo, heavy llm-torch, and semantic (requires torch).
# Install those individually if needed.
# `console` is listed EXPLICITLY: it previously worked under `all` only because
# comms/reachy dragged fastapi+uvicorn in at looser floors than console declares.
all = [
    "pymaxim[llm-llama,llm-server,llm-anthropic,llm-openai,vision,audio,reachy,comms,search,temporal,training,tts,database,console]",
]
# Test dependencies
test = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pytest-xdist>=3.5.0",  # Parallel test execution
    # A guard that fails by HANGING is not a guard — the runner kills the whole
    # job and the failure is indistinguishable from an infrastructure stall.
    # The D12 guard was exactly that shape: it asserts `elapsed < 5.0` AFTER the
    # call returns, and against the pre-fix code the call never returns, so the
    # assertion is never reached. `@pytest.mark.timeout(N)` turns that into a
    # bounded FAIL. See tests/unit/test_inference_lock_timeout.py.
    "pytest-timeout>=2.3.0",
]

[project.scripts]
maxim = "maxim.cli:main"
maxim-diagnostics = "maxim.utils.reachy_diagnostics:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["maxim*"]

[tool.setuptools.package-data]
# console/ui_dist/** is the VENDORED Console web bundle (built in maxim-pulse,
# copied in at release time by scripts/vendor_console_ui.py). It is
# .gitignore'd — a source checkout has none, and `maxim serve` then falls back
# to the "no UI installed" page. A wheel built after vendoring ships it, so a
# pip-installed user gets a working Console with no flag and no config.
maxim = ["_data/**/*", "py.typed", "console/openapi.json", "console/contract_surface.json", "console/ui_dist/**/*", "utils/architecture_baseline.json"]

# ─────────────────────────────────────────────────────────────────────────────
# Testing Configuration
# ─────────────────────────────────────────────────────────────────────────────

[tool.pytest.ini_options]
testpaths = ["tests"]
# Repo root on sys.path: tests/unit/test_lint_*.py import the CI lints via
# `from scripts import ...`. Without this they pass only under `python -m pytest`
# (which injects cwd) and fail under a bare `pytest`, and with sibling worktrees
# present an unqualified `scripts` package can bind to ANOTHER checkout's copy.
pythonpath = ["."]
# Nested worktrees (CLAUDE.md "Parallel sessions use worktrees"): an explicit `pytest .`
# must not collect .worktrees/*/tests twice with conflicting conftests.
norecursedirs = [".worktrees", ".git", "build", "dist", "*.egg-info"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short -ra"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "requires_model_cache: requires pretrained model or dataset assets (opt in with MAXIM_RUN_MODEL_TESTS=1)",
    "learning: marks learning/convergence tests that verify ML algorithms",
    "integration: marks tests requiring multiple subsystems",
    "robot: marks tests requiring Reachy hardware",
    "multi_agent_modes: auto-parametrize over single_agent / two_agents_shared_instance / two_agents_isolated_instances (P4 multi-agent rule; see tests/multi_agent_fixtures.py)",
    "single_agent_only: explicit opt-out of multi_agent_modes parametrization for tests that are genuinely single-agent",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

# ─────────────────────────────────────────────────────────────────────────────
# Linting Configuration
# CI pins the tool versions (ruff==0.14.14, mypy==1.20.0 in
# .github/workflows/test.yml). Keep local installs on the same versions;
# bump the CI pins deliberately alongside a reformat/typecheck pass.
# ─────────────────────────────────────────────────────────────────────────────

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F"]
ignore = [
    "E402",  # Deferred/lazy imports are intentional throughout the codebase
    "E501",  # Line length handled by line-length setting above
]

[tool.coverage.run]
source = ["src/maxim"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/embodied_runtime/selfy.py",  # Too coupled for unit testing currently
]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
show_missing = true
