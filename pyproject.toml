[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "maxim"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "reachy-mini[gstreamer]==1.2.6",
    "ultralytics==8.3.248",
    "lap==0.5.12",
    "faster-whisper>=1.0.0",
    "ctranslate2>=4.6.2",
    "onnxruntime==1.20.1",
    "av==11.0.0",
    "numpy==2.2.5",
    "opencv-python==4.12.0.88",
    "scipy==1.15.3",
    "tensorflow[and-cuda]>=2.15",
    "keras==3.13.0",
    "h5py==3.15.1",
    "protobuf>=3.20.3,<6.0.0",
    "matplotlib==3.10.8",
    "llama-cpp-python>=0.2.20",
]

[project.optional-dependencies]
# llama.cpp backend (CPU/GPU via llama-cpp-python)
llm-llama = [
    "llama-cpp-python>=0.2.20",
]
# PyTorch/Transformers backend (for Blackwell GPU support)
llm-torch = [
    "torch>=2.1",
    "transformers>=4.40.0",
    "accelerate>=0.27.0",
    "bitsandbytes>=0.43.0",
    "sentencepiece>=0.2.0",
    "huggingface-hub>=0.24.0",
]
# Legacy alias
llm = [
    "llama-cpp-python>=0.2.20",
]
tts = [
    "piper-tts>=1.2.0",
]
all = [
    "llama-cpp-python>=0.2.20",
    "transformers>=4.40.0",
    "accelerate>=0.27.0",
    "bitsandbytes>=0.43.0",
    "sentencepiece>=0.2.0",
    "huggingface-hub>=0.24.0",
    "piper-tts>=1.2.0",
]

[project.scripts]
maxim = "maxim.cli:main"
maxim-diagnostics = "maxim.utils.reachy_diagnostics:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["maxim*"]
