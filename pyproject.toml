[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "maxim"
version = "0.1.0"
description = "Agentic robotics framework for Reachy Mini with recursive planning and local LLM inference"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
keywords = ["robotics", "reachy", "llm", "agentic", "planning", "embodied-ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Robotics",
]
dependencies = [
    "reachy-mini[gstreamer]==1.2.6",
    "faster-whisper==1.1.1",
    "ctranslate2==4.6.2",
    "onnxruntime==1.20.1",
    "av>=14.0.0",
    "numpy==2.2.5",
    "opencv-python==4.12.0.88",
    "scipy==1.15.3",
    "tensorflow==2.20.0",
    "keras==3.13.0",
    "h5py==3.15.1",
    "protobuf>=3.20.3,<6.0.0",
    "matplotlib==3.10.8",
    "llama-cpp-python==0.3.8",
    "ddgs>=6.0.0",  # Web search capability (renamed from duckduckgo-search)
]

[project.optional-dependencies]
# llama.cpp backend (CPU/GPU via llama-cpp-python)
llm-llama = [
    "llama-cpp-python==0.3.8",
]
# PyTorch/Transformers backend (for Blackwell GPU support)
llm-torch = [
    "torch>=2.1",
    "transformers>=4.40.0",
    "accelerate>=0.27.0",
    "bitsandbytes>=0.43.0",
    "sentencepiece>=0.2.0",
    "huggingface-hub>=0.24.0",
]
# Legacy alias
llm = [
    "llama-cpp-python==0.3.8",
]
llm-anthropic = [
    "anthropic>=0.40.0",
]
llm-openai = [
    "openai>=1.0.0",
    "tiktoken>=0.7.0",
]
tts = [
    "piper-tts>=1.2.0",
]
# YOLOv8 vision backend (AGPL-3.0 — NOT included in core to keep MIT clean)
yolo = [
    "ultralytics==8.3.248",
    "lap==0.5.12",
]
# Twilio SMS/Voice communication
comms = [
    "twilio>=9.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.24.0",
]
# Phase 4: Neural semantic similarity (requires torch)
semantic = [
    "sentence-transformers>=2.2.0",
    "torch>=2.1",
]
# Temporal reference parsing for natural language time extraction
temporal = [
    "dateparser>=1.2.0",
]
all = [
    "llama-cpp-python==0.3.8",
    "transformers>=4.40.0",
    "accelerate>=0.27.0",
    "bitsandbytes>=0.43.0",
    "sentencepiece>=0.2.0",
    "huggingface-hub>=0.24.0",
    "anthropic>=0.40.0",
    "openai>=1.0.0",
    "tiktoken>=0.7.0",
    "piper-tts>=1.2.0",
    "sentence-transformers>=2.2.0",
    "dateparser>=1.2.0",
]
# Test dependencies
test = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pytest-xdist>=3.5.0",  # Parallel test execution
]

[project.scripts]
maxim = "maxim.cli:main"
maxim-diagnostics = "maxim.utils.reachy_diagnostics:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["maxim*"]

# ─────────────────────────────────────────────────────────────────────────────
# Testing Configuration
# ─────────────────────────────────────────────────────────────────────────────

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short -ra"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "learning: marks learning/convergence tests that verify ML algorithms",
    "integration: marks tests requiring multiple subsystems",
    "robot: marks tests requiring Reachy hardware",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

# ─────────────────────────────────────────────────────────────────────────────
# Linting Configuration
# ─────────────────────────────────────────────────────────────────────────────

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F"]
ignore = [
    "E402",  # Deferred/lazy imports are intentional throughout the codebase
    "E501",  # Line length handled by line-length setting above
]

[tool.coverage.run]
source = ["src/maxim"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/conscience/selfy.py",  # Too coupled for unit testing currently
]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
show_missing = true
