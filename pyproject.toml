[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pymaxim"
version = "0.5.0"
description = "Bio-inspired cognitive architecture with adaptive planning, biological memory systems, and local LLM inference. Works headless, with simulation, or connected to robots."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "Denny Schaedig"}]
keywords = ["cognitive-architecture", "llm", "agentic", "planning", "embodied-ai", "robotics", "memory", "simulation", "bio-inspired"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "numpy>=1.26,<3.0",
    "scipy>=1.11,<2.0",
    "pyyaml>=6.0,<7.0",
    "json-repair>=0.30,<1.0",
    "rich>=13.0.0,<14.0",
    # Plan 4 C2: cross-platform RMW file locking for drain state
    # serialization. Already present transitively via huggingface_hub /
    # torch on most installs; explicit here so headless peers without
    # either optional extra still get it. POSIX fcntl + Windows
    # msvcrt wrapped under one API.
    "filelock>=3.0,<4.0",
]

[project.urls]
Homepage = "https://github.com/dennys246/Maxim"
Repository = "https://github.com/dennys246/Maxim.git"
Issues = "https://github.com/dennys246/Maxim/issues"

[project.optional-dependencies]
# Vision perception (OpenCV + ONNX Runtime)
vision = [
    "opencv-python>=4.12,<5.0",
    "onnxruntime>=1.20,<2.0",
]
# Audio perception (Whisper + ctranslate2)
audio = [
    "faster-whisper>=1.1.1",
    "ctranslate2>=4.6.0",
    "av>=14.0.0",
]
# Reachy Mini robot hardware
reachy = [
    "reachy-mini[gstreamer]>=1.2.6,<1.3",
]
# Web search
search = [
    "ddgs>=6.0.0",
]
# Training support (MotorCortex model training)
training = [
    "tensorflow>=2.20,<3.0",
    "keras>=3.13,<4.0",
]
# llama.cpp backend (CPU/GPU via llama-cpp-python)
llm-llama = [
    "llama-cpp-python>=0.3.8",
]
# Host a local llama-cpp-server + speak to any OpenAI-compatible endpoint.
# Required for multi-LLM Phase 6 (local auto-spawn) and Phase 4 remote lanes.
llm-server = [
    "llama-cpp-python>=0.3.8",
    "sse-starlette>=1.6.0",
    "uvicorn>=0.22.0",
    "fastapi>=0.100.0",
    "pydantic-settings>=2.0.0",
    "starlette-context>=0.3.6",
    "openai>=1.0.0",
    "tiktoken>=0.7.0",
]
# PyTorch/Transformers backend (for Blackwell GPU support)
# NOTE: Blackwell (RTX 50 series, sm_120) requires torch>=2.7 built against CUDA 12.8.
# Install with: pip install torch>=2.7 --index-url https://download.pytorch.org/whl/cu128
llm-torch = [
    "torch>=2.7",
    "transformers>=4.40.0",
    "accelerate>=0.27.0",
    "bitsandbytes>=0.43.0",
    "sentencepiece>=0.2.0",
    "huggingface-hub>=0.24.0",
]
llm-anthropic = [
    "anthropic>=0.40.0",
]
llm-openai = [
    "openai>=1.0.0",
    "tiktoken>=0.7.0",
]
tts = [
    "piper-tts>=1.2.0",
]
# YOLOv8 vision backend (AGPL-3.0 — NOT included in core to keep Apache-2.0 clean)
# Bounded to 8.x so security patches flow through; pin major to catch breaking
# changes proactively. lap is also bounded similarly.
yolo = [
    "ultralytics>=8.3.248,<9.0",
    "lap>=0.5.12,<1.0",
]
# Twilio SMS/Voice communication
comms = [
    "twilio>=9.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.24.0",
]
# Phase 4: Neural semantic similarity (requires torch)
semantic = [
    "sentence-transformers>=2.2.0",
    "torch>=2.1",
]
# Temporal reference parsing for natural language time extraction
temporal = [
    "dateparser>=1.2.0",
]
# Database backend for Mother Maxim (PostgreSQL + pgvector)
database = [
    "psycopg[binary]>=3.1",
    "pgvector>=0.3",
]
# Everything except AGPL-licensed yolo, heavy llm-torch, and semantic (requires torch).
# Install those individually if needed.
all = [
    "pymaxim[llm-llama,llm-server,llm-anthropic,llm-openai,vision,audio,reachy,comms,search,temporal,training,tts,database]",
]
# Test dependencies
test = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pytest-xdist>=3.5.0",  # Parallel test execution
]

[project.scripts]
maxim = "maxim.cli:main"
maxim-diagnostics = "maxim.utils.reachy_diagnostics:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["maxim*"]

[tool.setuptools.package-data]
maxim = ["_data/**/*", "py.typed"]

# ─────────────────────────────────────────────────────────────────────────────
# Testing Configuration
# ─────────────────────────────────────────────────────────────────────────────

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short -ra"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "learning: marks learning/convergence tests that verify ML algorithms",
    "integration: marks tests requiring multiple subsystems",
    "robot: marks tests requiring Reachy hardware",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

# ─────────────────────────────────────────────────────────────────────────────
# Linting Configuration
# ─────────────────────────────────────────────────────────────────────────────

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F"]
ignore = [
    "E402",  # Deferred/lazy imports are intentional throughout the codebase
    "E501",  # Line length handled by line-length setting above
]

[tool.coverage.run]
source = ["src/maxim"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/embodied_runtime/selfy.py",  # Too coupled for unit testing currently
]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
show_missing = true
