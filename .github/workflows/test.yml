        run: |
          # For every docs/experiments/data/ entry whose experiment has a
          # pre-registration, the prereg's (and each PRE-DATA amendment's)
          # FIRST commit on origin/main must precede the data's first `ts`
          # (fallback: the data's own first commit). Exp 53/53b landed the
          # 53b prereg in the same squash as its data and got an EARNED row
          # the same afternoon the 1.1.0 tag was placed; this step is what
          # would have failed that PR. The original 53/53b files, the 53
          # inputs and the 44b pilot are grandfathered BY EXPLICIT LIST with
          # reasons (reported as still-failing, never silently passed).
          # Needs full history of main: a --depth=1 checkout makes every
          # file look freshly added, so a shallow repo is exit 2, not a pass.
          # Positive control: tests/unit/test_lint_prereg_precedes_data.py
          # builds a fixture repo with the order wrong and asserts the fail.
          git fetch --unshallow origin main 2>/dev/null || git fetch origin main
          # On a push, judge the pushed commit itself: origin/main can already be NEWER than HEAD when pushes queue.
          ref=origin/main
