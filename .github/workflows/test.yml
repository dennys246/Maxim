name: Tests

on:
  push:
    branches: [main]
  pull_request:
    # No `branches:` filter (D63, 2026-10-06): a PR against a sibling branch gets Tests at OPEN, not only after it is
    # retargeted to main. The diff-scoped lints judge it against the merge-base with origin/main, so a stacked PR's
    # verdict includes its parent's commits (e.g. the fix->tests title rule sees parent+child) and can differ from the
    # verdict after retarget; the required checks on the final PR to main are the gate. Cost: a stacked PR runs at open,
    # on each push and again on retarget. CodeQL default setup analyses PRs to the default branch only.
    #
    # `edited` is here for ONE reason: retargeting a PR's base branch.
    #
    # The default activity set is [opened, synchronize, reopened]. Changing a
    # PR's base fires `edited`, which is in none of them — so on 2026-08-31 the
    # 1.1.2 stack sat with THREE open PRs and zero CI runs, and the PR pages
    # showed no failing checks because there were no checks at all. An absent
    # check reads exactly like a passing one (docs/lessons/green-pr-with-no-tests-run.md).
    # A PR created against a sibling branch used to be filtered out by
    # `branches: [main]` at open time, and retargeting it to main never
    # re-triggered; the only workarounds were close+reopen or an empty commit.
    #
    # KNOWN COST, accepted deliberately: `edited` also fires on title and body
    # edits, so those now cost a CI run. The `concurrency` block below cancels
    # in-progress PR runs, so a burst of edits collapses to one. GitHub offers
    # no narrower type — there is no `base_changed`. The alternative is a
    # per-job `if: github.event.action != 'edited' || github.event.changes.base`
    # guard, which is exact but must be repeated on every job and silently
    # missed by the next one added; that is the failure mode the workflow-level
    # `permissions` block below was written to avoid, so it is not repeated here.
    types: [opened, synchronize, reopened, edited]
  # Lets the slow aarch64 real-install job be run on demand (it is skipped on
  # PRs). Without this its `github.event_name == 'workflow_dispatch'` condition
  # could never fire, so the job would only ever execute post-merge on main.
  workflow_dispatch:
  # Nightly lane for the model-cache tests, which are skipped by default so the
  # required fast suite stays offline and hermetic (D20). Without a scheduled
  # run they would execute NOWHERE — see the `model-cache-tests` job below.
  schedule:
    - cron: "17 8 * * *"

# Supersede in-flight runs for the same ref instead of letting them compete
# for runners (2026-08-06 CI starvation incident).
#
# WHAT HAPPENED: with several PRs open and pushed in quick succession, jobs
# were created but NEVER ASSIGNED A RUNNER (`runner_name: ""`), sat in the
# queue, and were killed at exactly 15m01s with zero steps executed. They
# surfaced as `failure` in `gh pr checks`, indistinguishable from real test
# failures — five PRs looked red while the only PR with source changes was
# green. Healthy runs are ~12 min of real work (3m45s install + 7m43s tests),
# so this was not slowness; it was demand. Every push previously left its
# predecessor's run alive, so N pushes to one branch competed for N times the
# slots.
#
# `cancel-in-progress` is deliberately FALSE on main: a RUNNING main run is never
# cancelled, because main's CI result is what the release gate and the post-merge
# verification read. Only PR-branch runs are cancellable. Note that GitHub still
# cancels a PENDING run in the group when a newer one queues, whatever this says,
# so with pushes A, B, C the run for B may never execute: the diff-scoped lints
# therefore judge a push against the last push whose job PASSED, not against
# `before` (scripts/_lint_git.py::push_base, #1089).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Least-privilege default for EVERY job, including ones added later.
#
# CodeQL's `actions/missing-workflow-permissions` fires per job that does not
# declare a scope, and this repo's ruleset blocks merges on
# `alerts_threshold: all` — so a new job without this is not a style nit, it
# is a blocked PR. That had already been learned once (see the per-job blocks
# on the aarch64 jobs below, which carry the same explanation); the two jobs
# this branch added rediscovered it. Declaring the default at workflow level
# fixes the class instead of the instance: a job may still narrow or widen its
# own scope, but it can no longer inherit an implicit one by omission.
#
# `contents: read` is all any job here needs — every one of them checks out
# code and runs tests. Nothing writes to the repo, comments on PRs, or
# publishes packages.
permissions:
  contents: read

jobs:
  python-compatibility:
    name: Python ${{ matrix.python-version }} compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # The full unit job covers 3.12. These lanes enforce the rest of the
        # public Requires-Python range without multiplying the expensive
        # optional-backend suite.
        python-version: ["3.10", "3.11", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the core package
        run: python -m pip install .

      - name: Compile and import public surfaces
        run: |
          python -m compileall -q src/maxim
          python - <<'EOF'
          from importlib.metadata import version

          import maxim

          assert maxim.__version__ == version("pymaxim"), maxim.__version__
          # DERIVED from maxim._API_VERBS, not hand-kept. The previous form was
          # a hardcoded 18-name tuple carrying the comment "must stay in sync
          # with maxim._API_VERBS — an omitted verb is an undetectable break",
          # and it had drifted to exactly that: unregister_tool,
          # list_registered_tools and clear_registered_tools were missing, so
          # this lane never checked them on 3.10/3.11/3.13/3.14 (the fast suite
          # only runs on 3.12). A list that must be kept in sync by hand is a
          # list that will not be; iterate the real surface instead.
          verbs = sorted(maxim._API_VERBS)
          assert len(verbs) >= 18, f"_API_VERBS collapsed to {len(verbs)} — surface broken?"
          for name in verbs:
              assert callable(getattr(maxim, name)), name
          print(f"Python compatibility smoke OK: {maxim.__version__}, {len(verbs)} verbs")
          EOF
          python -m maxim --help >/dev/null

  # ───────────────────────────────────────────────────────────────────────
  # Model-cache tests — nightly + on demand, never on PRs.
  #
  # `tests/conftest.py` skips everything marked `requires_model_cache` unless
  # MAXIM_RUN_MODEL_TESTS=1, so the required fast suite needs no network and no
  # pretrained weights (D20). The cost of that correctness is that 12 substrate
  # and encoder tests — including the P4 fixture recall gate, whose docstring
  # says it exists so a regression "fires this test instead of silently passing
  # CI" — would otherwise run in no lane at all. A guard that cannot execute
  # cannot detect its failure, so it gets its own scheduled lane.
  #
  # The HuggingFace cache is keyed on the encoder-pinning files; a cache miss
  # downloads once and every later night reuses it.
  # ───────────────────────────────────────────────────────────────────────
  model-cache-tests:
    name: Model-cache tests (nightly)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # `semantic` brings sentence-transformers + torch; torchvision and Pillow
      # are NOT in any extra but several marked tests importorskip them, and a
      # skipped test in a lane built to run them is exactly the vacuous-guard
      # problem this job exists to prevent.
      - name: Install package with model-test dependencies
        run: |
          python -m pip install --upgrade pip
          # console + sign too (1.3.1): `pytest tests/` COLLECTS every module before `-m` deselects, and
          # a module whose extra is absent skips at collection. That used to be excused module by module
          # in an allow-list that grew every time a console test file was added (16 red nights); now the
          # lane installs what it collects and --require-extras below fails any skip for them.
          python -m pip install -e ".[semantic,test,console,sign]" torchvision Pillow spacy \
            -c .github/constraints/console.txt
          # test_concept_decomposition_validation is a PRIMARY substrate validation; it
          # was going to be allow-listed as "a dataset-class dependency" while the lane's
          # own comment says a skipped test here is the vacuous-guard problem. en_core_web_sm
          # is ~15 MB and pip-installable, so the lane runs it instead of excusing it.
          python -m spacy download en_core_web_sm

      # The warm list is part of the cache KEY. Without this the key ignores
      # which models the lane needs: the 2026-08-21 → 08-29 failures were an
      # EXACT key hit on a cache built before all-MiniLM-L6-v2 was required, so
      # the warm step was skipped and every run failed offline on a model the
      # cache did not hold. Deriving the list into a file first makes the key
      # change the moment the required set changes.
      - name: Derive the required model list
        run: python3 scripts/model_cache_names.py > warm-list.txt && cat warm-list.txt

      - name: Restore model cache
        id: model-cache
        uses: actions/cache@v4
        with:
          path: /home/runner/.cache/huggingface
          key: hf-${{ runner.os }}-${{ hashFiles('warm-list.txt', 'pyproject.toml', 'src/maxim/similarity/encoder.py', 'src/maxim/models/vision/clip_encoder.py') }}
          restore-keys: hf-${{ runner.os }}-

      # First run (or after an encoder change) populates the cache; later runs
      # are offline. Downloads are confined to this step so a network failure
      # here is distinguishable from a real test failure below.
      # Runs UNCONDITIONALLY, not `if: cache-hit != 'true'`: a restore-keys
      # partial hit (or the exact-hit-on-a-stale-cache above) leaves models
      # missing, and loading an already-cached model is a no-op. Fail here and
      # the cause is "HF unreachable", distinguishable from a test failure.
      - name: Warm the cache
        env:
          HF_HOME: /home/runner/.cache/huggingface
        run: |
          python - <<'PY'
          from sentence_transformers import SentenceTransformer

          names = open("warm-list.txt").read().split()
          if not names:
              raise SystemExit("FAIL: warm list is empty — scripts/model_cache_names.py found no models")
          for name in names:
              SentenceTransformer(name)
              print(f"cached {name}")
          PY

      # Assert the lane actually EXECUTED its tests (skip allow-list below).
      # Without this, a missing dependency or a renamed marker turns the
      # whole job into a green no-op — the failure mode that let these
      # guards rot in the first place.
      - name: Run model-cache tests
        env:
          MAXIM_RUN_MODEL_TESTS: "1"
          # MUST be set explicitly and absolutely. tests/conftest.py only
          # `setdefault`s HF_HOME under MAXIM_RUN_MODEL_TESTS, so without this
          # the suite runs offline against an EMPTY temp root and every model
          # test errors on a missing encoder — the warmed cache above would be
          # unreachable and this whole lane would be the vacuous guard it
          # exists to prevent. `~` is not expanded in GitHub `env:`, and HOME
          # is redirected by conftest, so the literal path is required.
          HF_HOME: /home/runner/.cache/huggingface
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: |
          # Inside the loopback-only network namespace (scripts/ci_netns.sh, #940): the models are warmed above.
          bash scripts/ci_netns.sh '"$PY" -m pytest tests/ -q -m "requires_model_cache" --tb=short \
            --require-extras=console,sign \
            --junitxml=model-cache-results.xml'
          # Every skipped test must be on the EXPLICIT allow-list in
          # scripts/check_model_cache_lane.py with a reason (dataset-gated
          # or missing-dependency-path tests); anything else skipping is
          # the vacuous-guard failure this lane exists to catch. Replaces
          # the old `executed >= 12` floor, which could not see WHICH tests
          # were vacuous.
          python3 scripts/check_model_cache_lane.py model-cache-results.xml

  # ── The slow lane ─────────────────────────────────────────────────────────
  # `@pytest.mark.slow` has been a registered marker applied across ~10 files
  # for months, and until 2026-08-30 the ONLY occurrence of the word in this
  # workflow was the fast suite's `-m "not slow"` — a deselection. Nothing ever
  # ran them. Nightly, because they are slow; with an executed>0 assert,
  # because `pytest -m slow` exits 0 both when it collects nothing and when
  # everything skips, and a lane that cannot go red for the reason it exists is
  # decoration (same reasoning as model-cache-tests' allow-list check).
  slow-tests:
    name: Slow tests (nightly)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libgstreamer1.0-dev gstreamer1.0-plugins-base
      # The lane INSTALLS what its tests need and RUNS them (roadmap 1.3.2 item 7, #940; owner decision
      # 2026-10-04). On the 2026-10-05 nightly 46 slow tests were selected and 16 ran: the rest skipped for the
      # semantic extra and the model cache this lane never installed, and an `executed > 0` floor called it green.
      # The model-cache lane's install and cache steps, plus the optional backends; no `||` anywhere.
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pytest-cov pytest-xdist pytest-timeout
          python -m pip install -e ".[semantic,test,console,sign]" torchvision Pillow spacy \
            -c .github/constraints/console.txt
          python -m spacy download en_core_web_sm
          pip install faster-whisper ctranslate2 onnxruntime av numpy opencv-python scipy llama-cpp-python ddgs pyyaml
      - name: Derive the required model list
        run: python3 scripts/model_cache_names.py > warm-list.txt && cat warm-list.txt
      - name: Restore model cache
        uses: actions/cache@v4
        with:
          path: /home/runner/.cache/huggingface
          key: hf-${{ runner.os }}-${{ hashFiles('warm-list.txt', 'pyproject.toml', 'src/maxim/similarity/encoder.py', 'src/maxim/models/vision/clip_encoder.py') }}
          restore-keys: hf-${{ runner.os }}-
      - name: Warm the cache
        env:
          HF_HOME: /home/runner/.cache/huggingface
        run: |
          python - <<'PYWARM'
          from sentence_transformers import SentenceTransformer

          names = open("warm-list.txt").read().split()
          if not names:
              raise SystemExit("FAIL: warm list is empty")
          for name in names:
              SentenceTransformer(name)
              print(f"cached {name}")
          PYWARM
      - name: Run the slow lane
        env:
          MAXIM_RUN_MODEL_TESTS: "1"
          HF_HOME: /home/runner/.cache/huggingface
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        # Inside the loopback-only network namespace too (scripts/ci_netns.sh): the models are warmed above.
        run: |
          bash scripts/ci_netns.sh '"$PY" -m pytest tests/ -q -m "slow" --tb=short --require-extras=console,sign \
            --junitxml=slow-results.xml'
      - name: Assert the lane ran its exact roster
        # Runs even when the lane itself failed: "not its roster" and "3 failed" are different diagnoses and the
        # second must not hide the first. scripts/slow_lane_roster.json is the roster; only its listed skips
        # (each with a reason) may skip. The PR-time twin: tests/unit/test_slow_lane_roster.py.
        if: always()
        run: python3 scripts/check_slow_lane.py slow-results.xml

  # ── The merge gate's settings (M6 / D63; owner decisions 2026-10-06) ─────────
  # GitHub refuses a merge while a required check is absent, given the settings pinned in
  # scripts/repo_settings_expected.json; this job catches those settings DRIFTING (a removed required check, admins
  # un-enforced, a new ruleset, CodeQL losing a language, a ruleset bypass USED). "(nightly)" in the name means the
  # release gate (scripts/check_nightlies.py) refuses to publish while it is red. The token (Administration:
  # Read-only, this repo only) lives in the `settings-check` environment, deployable from `main` only, so no PR run
  # can read it; without it the check exits 2, never passes. GitHub auto-creates a missing environment UNFENCED the
  # first time a job names it, so the owner creates it (main only) first, and the check pins that fence too.
  repo-settings:
    name: Repo settings (nightly)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: settings-check
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the checker's one dependency
        run: pip install "pyyaml>=6.0,<7.0"
      - name: The merge gate's settings are as committed
        env:
          GH_TOKEN: ${{ secrets.SETTINGS_READ_TOKEN }}
        run: python3 scripts/check_repo_settings.py

  # ── Release truth ─────────────────────────────────────────────────────────
  # Not a PR gate: it needs PyPI + the GitHub API, and a network flake must not
  # block unrelated PRs. It runs where a release actually lands (push to main),
  # nightly, and on demand. Every version PyPI serves must have a tag, a
  # Release object, the exact wheel + sdist (sha256-matched), and notes with
  # absolute links; historical failures are grandfathered BY EXPLICIT LIST with
  # reasons inside the script and reported as still-failing on every run.
  # Offline part (tag ↔ CHANGELOG drift) runs in the same invocation.
  # NOTE: as of 2026-08-29 all 16 PyPI versions are grandfathered by explicit
  # list, so green here means "no NEW release drifted", not "the back catalogue
  # is clean" — the script prints every grandfathered failure on every run.
  release-audit:
    name: Release-object audit (tags, assets, sha256, links)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # tags
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Audit release tags and Release objects
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/audit_release_tags.py --check-releases

  # ── The artifact seam — bugs ledger D47 + D48 ─────────────────────────────
  # Nothing in CI built a wheel before 2026-08-30, and on that day two bad
  # wheels got as far as `twine check` and PASSED it: one with ZERO files under
  # console/ui_dist/ (built from a worktree — the bundle is gitignored and
  # vendored at release time), and one carrying a 1.1.0 version from a stale
  # branch. `twine check` validates that metadata RENDERS; it never asks
  # whether the artifact contains what it should or is the version you meant.
  # This job asks. It runs on PRs too — a packaging regression should redden
  # the PR that causes it, not the release three weeks later.
  release-build:
    name: Release build (wheel contents + version)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read  # check_nightlies.py reads the scheduled runs
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tooling
        run: python -m pip install --upgrade pip build twine
      - name: Stub the vendored Console bundle
        run: |
          # A CI checkout legitimately has no Console bundle: it is built in
          # maxim-pulse and copied in by scripts/vendor_console_ui.py at
          # release time. Stubbing it here is NOT pretending the real bundle
          # shipped — it proves the thing CI can actually prove: that
          # pyproject's `console/ui_dist/**/*` package-data glob really does
          # carry that tree into the wheel. If the glob breaks, this job goes
          # red even though every source file is present, which is the D47
          # failure mode one layer up.
          mkdir -p src/maxim/console/ui_dist/assets
          echo '<html><!-- CI stub --></html>' > src/maxim/console/ui_dist/index.html
          echo '//' > src/maxim/console/ui_dist/assets/index-ci.js
          echo '{"target":"console","contract_version":"ci-stub"}' > src/maxim/console/ui_dist/maxim-ui.json
      - name: Build wheel + sdist
        run: |
          rm -rf build/ dist/ *.egg-info
          python -m build
      - name: twine check (metadata only — deliberately not the gate)
        run: twine check dist/*
      - name: Audit the built wheel (D47 contents + D48 version)
        run: |
          # --allow-missing-ui-dist is NOT passed: the stub above means the
          # real assertion runs here. The D47 branch's negative control lives
          # in tests/unit/test_audit_release_build.py, which builds synthetic
          # wheels carrying each defect — so this guard has been shown to fail,
          # not merely to pass.
          python3 scripts/audit_release_build.py
      - name: A release waits for green nightlies
        # roadmap 1.3.x "the release procedure reads the nightlies": the model-cache and slow lanes
        # never run on a PR, so a release PR could not see them red. A no-op unless this tree cuts a
        # release (pyproject's version has no v<version> tag yet); then every (nightly) job of the
        # latest scheduled run on main must have succeeded. Fails closed (exit 1 red, 2 unreadable).
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/check_nightlies.py --only-when-releasing

  unit-tests:
    runs-on: ubuntu-latest
    # 60, not 45: the fast suite now runs under coverage (roadmap 1.3.2 item 5). Figures so far:
    # 18:26 for the fast suite in CI without coverage (run 37217982246); 26:46 locally with --cov.
    # The CI figure with coverage is recorded on the gate PR.
    timeout-minutes: 60
    # On a push to main the diff-scoped lints judge the range since the last push whose job passed
    # (scripts/_lint_git.py::push_base, #1089): they read the Actions runs and each landed commit's merged PR through
    # `gh api`, so the job needs those read scopes and a token. Pinned by tests/unit/test_lint_git_push.py.
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v4
        with:
          # The coverage ratchet's diff rules need the merge-base: a depth-1 checkout has none, and
          # on a pull request scripts/lint_coverage.py then fails (_lint_git.must_not_skip).
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgstreamer1.0-dev gstreamer1.0-plugins-base

      - name: Install package and test dependencies
        run: |
          # pytest-timeout is load-bearing, not convenience: the D12 guard
          # (tests/unit/test_inference_lock_timeout.py) fails by HANGING
          # against the pre-fix router, which the runner reports as an
          # infrastructure stall rather than as that defect. Without the
          # plugin the @pytest.mark.timeout marker is silently ignored and the
          # guard goes back to being unfalsifiable.
          #
          # coverage + pytest-cov are pinned EXACTLY: the coverage ratchet's floors are measured by
          # this version, and the coverage ratchet refuses a coverage.json written by any other
          # (the version constant there must move with this pin).
          # pyyaml here (not only in the guarded optional line below): the coverage ratchet reads
          # this workflow structurally to verify its own step.
          pip install pytest "pytest-cov==7.0.0" "coverage==7.13.3" pytest-xdist pytest-timeout "pyyaml>=6.0,<7.0"
          # Install without deps first (reachy-mini requires robot hardware SDK),
          # then install available deps separately
          pip install --no-deps -e .
          # No `|| echo`: a failed install fails here (roadmap 1.3.2 item 7, #940). Every package installed on
          # the 2026-10-05 main run; a skip for a missing backend would otherwise pass as green.
          pip install faster-whisper ctranslate2 onnxruntime av numpy opencv-python scipy llama-cpp-python ddgs pyyaml

      - name: Install the console + sign extras (the extras lane)
        # roadmap 1.3.x "Test/CI truthfulness" / public_oasis Phase 0 item 1: without these the
        # console, bundle-signing, hive-pull and Oasis-exchange tests skipped on EVERY lane, and the
        # 1.2 and 1.3 headlines both travel the signed-bundle path. Read from pyproject so the lane
        # installs exactly what the extras declare. NOT `|| echo`: a failed install must fail here.
        run: |
          python - <<'PY' > extras-reqs.txt
          import tomllib
          extras = tomllib.load(open("pyproject.toml", "rb"))["project"]["optional-dependencies"]
          print("\n".join(extras["console"] + extras["sign"]))
          PY
          cat extras-reqs.txt
          # -c: pin the contract GENERATOR (see the file for why and how to move it)
          pip install -r extras-reqs.txt -c .github/constraints/console.txt

      - name: mypy public API surface + hivemind + composition layer
        # CLAUDE.md required check, promoted to CI (1.0 guard promotion).
        # --follow-imports=silent scopes error reporting to the checked
        # files; the rest of the codebase is not mypy-clean yet.
        # hivemind/ added per 1.2 gate 8 (roadmap): the bundle format is a
        # wire boundary and 1.2 rewrites its merge path — that is where
        # typing pays (the 5 hivemind files; repo-wide is not worth it).
        # The composition layer (executor, agent_loop, bridges/, planning/)
        # added per roadmap 1.3.2 item 4: the #840/#841 silent seams were
        # argument mismatches swallowed by a broad except, which mypy
        # catches; adding it found #1083 (an approved proposal's outcome
        # record raised). #840's dead calls remain line-ignored while Dormant;
        # --warn-unused-ignores keeps those ignores from going stale silently.
        # The repo-wide error-count ratchet is separate.
        # Pinned so a mypy release can't break CI on its own. Runs before
        # the test suite for faster failure feedback.
        # NOT the lint job's "mypy per-file ratchet" invocation (that one: --no-site-packages,
        # --check-untyped-defs, all of src/maxim): neither step green implies the other.
        run: |
          pip install "mypy==1.20.0"
          mypy src/maxim/__init__.py src/maxim/api.py src/maxim/session.py \
               src/maxim/create.py src/maxim/load.py \
               src/maxim/hivemind/ \
               src/maxim/runtime/executor.py src/maxim/runtime/agent_loop.py \
               src/maxim/runtime/loop_setup.py src/maxim/runtime/loop_gates.py \
               src/maxim/bridges/ src/maxim/planning/ \
               --ignore-missing-imports --follow-imports=silent --warn-unused-ignores

      - name: Run required fast suite
        # Measured under coverage in this ONE run (roadmap 1.3.2 item 5, owner decision 2026-10-04):
        # no second pass. Configuration comes only from pyproject.toml [tool.coverage]. Stale data
        # from an earlier run is deleted first so the ratchet can only read this run's numbers.
        #
        # Inside a loopback-only network namespace (roadmap 1.3.2 item 7, #940; owner decision 2026-10-04, no
        # OS-level exception; scripts/ci_netns.sh says how): the in-process guard cannot see a SUBPROCESS a test
        # spawns, the kernel can. MAXIM_EXPECT_NETNS=1 arms the positive control, tests/unit/test_network_boundary.py.
        run: |
          rm -f .coverage coverage.json coverage.xml
          SUITE='"$PY" -m pytest tests/ -x -q -m "not slow" --tb=short \
            --ignore=tests/integration/test_memory_hub.py \
            --require-extras=console,sign \
            --cov=src/maxim --cov-branch --cov-report=json:coverage.json --cov-report='
          bash scripts/ci_netns.sh "$SUITE"

      # The project's required-checks block is TWO commands, and the fast suite
      # above excludes this file. Without this step the MemoryHub gate is
      # enforced by nothing but developer habit — the same "advertised suite is
      # not the executed suite" defect D20 exists to close. It runs in ~1s.
      - name: MemoryHub integration gate
        run: python -m pytest tests/integration/test_memory_hub.py -q

      - name: Coverage ratchet (roadmap 1.3.2 item 5)
        # Floors (overall + per package, 1.0-pt band), diff coverage >= 80% of changed executable
        # src/maxim lines vs the merge-base, the fixed [tool.coverage] table, and the reviewed
        # exclusion list + ledger (scripts/coverage_floors.json, scripts/coverage_exclusions.json).
        # Deliberately NOT `if: always()`: after a failed `-x` run the data is partial.
        # Prints overall + per-package coverage every run. Positive control:
        # tests/unit/test_lint_coverage.py.
        run: python scripts/lint_coverage.py

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # On a push to main the diff-scoped lints judge the range since the last push whose job passed
    # (scripts/_lint_git.py::push_base, #1089): they read the Actions runs and each landed commit's merged PR through
    # `gh api`, so the job needs those read scopes and a token. Pinned by tests/unit/test_lint_git_push.py.
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v4
        with:
          # FULL history. The diff-scoped lints below resolve a merge-base with
          # origin/main; with the default depth-1 checkout plus a `--depth=1`
          # fetch, the two histories are disjoint shallow roots, merge-base
          # fails, and every one of them SKIPS — verified 2026-08-29 (run
          # 33259722155): the multi-agent marker lint and the swallow lint's
          # check 2 had been no-ops on every pull request since they shipped.
          # scripts/_lint_git.py::must_not_skip now also turns that skip into a
          # hard error on pull_request, so a regression here fails loudly.
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ruff lint + format check
        # CLAUDE.md required checks, promoted to CI (1.0 guard promotion).
        # Pinned so a ruff release's new rules/format changes can't break
        # CI on their own — bump the pin deliberately alongside a
        # ruff check/format pass in the same commit.
        run: |
          pip install "ruff==0.14.14"
          pip install "pyyaml>=6.0,<7.0"  # scripts/lint_body_rest_neutral.py reads body YAML
          pip install "mypy==1.20.0"  # scripts/lint_mypy_ratchet.py; same pin as unit-tests' mypy step
          ruff check src/ tests/
          ruff format --check src/ tests/

      - name: Version sync (pyproject == __init__ == CHANGELOG header == the three version lines)
        # CLAUDE.md "Versioning" (policy decided 2026-08-29, roadmap 1.1.x item
        # 16.1: main is ahead of PyPI; the bump happens in the release
        # transaction). scripts/lint_version_sync.py asserts pyproject ==
        # __init__, a `## [version]` CHANGELOG section exists, and the CLAUDE.md
        # / docs/plans/README.md / docs/index.md version lines name that version
        # with no "pending"/"rc"/"serves" prose (they link PyPI instead).
        # Positive control: tests/unit/test_lint_version_sync.py.
        run: python3 scripts/lint_version_sync.py

      - name: Check all Python files parse
        run: |
          python -c "
          import ast, sys, pathlib
          errors = []
          for p in pathlib.Path('src/maxim').rglob('*.py'):
              try:
                  ast.parse(p.read_text())
              except SyntaxError as e:
                  errors.append(f'{p}: {e}')
          if errors:
              print('\n'.join(errors))
              sys.exit(1)
          print(f'All {len(list(pathlib.Path(\"src/maxim\").rglob(\"*.py\")))} files parse OK')
          "

      - name: CI grep invariants (urllib + dead mesh modules + Plan 3 no-retry-loop + deprecated probe shims + PTB dormancy)
        run: |
          if grep -rn "urllib.request.urlopen" src/maxim/ | grep -v "utils/http.py"; then
            echo "ERROR: raw urllib.request.urlopen outside utils/http.py"
            exit 1
          fi
          # #822/#832: the internet tools are wired ONLY by build_tool_registry (runtime/bootstrap.py), and
          # only the loader (utils/internet_access.py) composes the effective view. The full, alias-proof
          # check is the AST test tests/unit/test_internet_policy_832.py::test_only_the_builder_wires_the_internet_tools;
          # this grep is the belt.
          if grep -rnE --include=*.py "live_internet_policy_getter|get_internet_policy=|[^ ]InternetSearchTool\(|[^ ]HttpFetchTool\(|= *(InternetSearchTool|HttpFetchTool)\(" src/maxim/ | grep -v "^src/maxim/runtime/bootstrap.py:\|^src/maxim/utils/internet_access.py:"; then
            echo "ERROR: internet tools or their policy getter wired outside runtime/bootstrap.py (pass internet_launch_enabled= to build_tool_registry)"
            exit 1
          fi
          if grep -rn --include=*.py "EffectiveInternetPolicy(" src/maxim/ | grep -v "^src/maxim/utils/internet_access.py:"; then
            echo "ERROR: EffectiveInternetPolicy built outside utils/internet_access.py (only the loader composes it)"
            exit 1
          fi
          # PerceptTraceBuffer is DORMANT (R4's look-back design review, 2026-09-24,
          # docs/plans/lookback_primitive.md): no consumer needs it — NAc keeps its own eligibility
          # trace and retroactive tagging looks back over the Hippocampus record. Its tick() decays
          # per CALL, not per second, and its storage is shared across agents; both are unfixed while
          # it is Dormant. This check enforces the dormancy: reviving it (the plan's trigger: two
          # consumers needing encode-by-encode history with different kernels) means a new review
          # that fixes the clock, and deleting this check in that PR.
          # Also catches an aliased import (`import PerceptTraceBuffer as PTB`). A spaced call
          # (`PerceptTraceBuffer (...)`) is not matched on purpose: ruff format removes that space, and
          # a whitespace-tolerant pattern false-positives on docstrings ("PerceptTraceBuffer (for ...)").
          if grep -rnE "PerceptTraceBuffer\(|import PerceptTraceBuffer as " src/maxim/ scripts/ | grep -v "src/maxim/memory/percept_trace_buffer.py"; then
            echo "ERROR: PerceptTraceBuffer is Dormant and must not be constructed in production code"
            echo "       (docs/plans/lookback_primitive.md; reviving it needs a new review that fixes its clock)."
            exit 1
          fi
          if grep -rnE "from maxim\.mesh\.(peer_registry|peer_info|peer_channel|task_delegation|knowledge|clock|agent_identity|admission)" src/maxim/ tests/; then
            echo "ERROR: import from deleted mesh modules"
            exit 1
          fi
          # Plan 3 R2.5 no-retry-loop invariant: _MaximPeerBackend must
          # never grow an internal repeat loop. The `retry_after_s` and
          # `retry_timeout_s` parameter names are contractual (they
          # match BackendOverloaded + the pre-R2.6 probe signature) and
          # are the only permitted matches.
          if grep -nE "retry|backoff|gateway" src/maxim/models/language/maxim_peer_backend.py | grep -vE "retry_after_s|retry_timeout_s"; then
            echo "ERROR: Plan 3 no-retry-loop invariant violated in maxim_peer_backend.py"
            echo "       _MaximPeerBackend makes EXACTLY one HTTP call per complete_with_usage."
            echo "       Failover is the router's job. See docs/plans/archive/llm_path_fast_failover.md."
            exit 1
          fi
          # stall_detector_timeout_awareness.md invariant: new stall
          # detectors MUST consult runtime/stall_threshold.py rather than
          # defining their own hardcoded 30s threshold. Matches literal
          # patterns like `STALL_S = 30` or `stall_threshold = 30` outside
          # the canonical module + its tests. Pure 30-as-non-stall integers
          # in unrelated contexts won't match because the rule requires
          # "STALL" in the assigned name.
          STALL_LITERAL_MATCHES=$(grep -rnE "(STALL[A-Z_]*|stall[a-z_]*threshold)\s*=\s*30(\.0)?\b" \
              --include="*.py" src/maxim/ \
            | grep -vE "^src/maxim/runtime/stall_threshold\.py:" \
            | grep -vE "^src/maxim/runtime/heartbeat\.py:" \
            || true)
          # heartbeat.py allowlisted: Stage 2 of stall_detector_timeout_awareness.md
          # migrates heartbeat to compute_stall_threshold via opt-in
          # MAXIM_HEARTBEAT_USE_LANE_TIMEOUT; target 1.0.x.
          if [ -n "$STALL_LITERAL_MATCHES" ]; then
            echo "ERROR: hardcoded 30s stall threshold outside runtime/stall_threshold.py:"
            echo "$STALL_LITERAL_MATCHES"
            echo "       Use compute_stall_threshold() from runtime/stall_threshold.py"
            echo "       See docs/plans/deferred/stall_detector_timeout_awareness.md."
            exit 1
          fi
          # leader_ux_profile_management.md L2 + L3 invariant: every
          # module that reads ~/.config/maxim/profiles.yml must use
          # yaml.safe_load exclusively. yaml.load allows arbitrary
          # Python object construction via untrusted YAML — a hard
          # security boundary at the operator-config layer.
          for f in \
              src/maxim/models/language/profile_loader.py \
              src/maxim/models/model_cli.py; do
            if grep -nE "yaml\.load\(" "$f" | grep -v "yaml.safe_load"; then
              echo "ERROR: $f uses bare yaml.load() — must use yaml.safe_load()"
              exit 1
            fi
          done
          # Probe shims removed (v1 cleanup C1). probe_llm_server,
          # llm_server_responding_at, and _probe_once were moved/deleted.
          # Probe primitives now live in maxim_peer_backend.py. Block any
          # re-introduction of the old shim names in production code.
          PROBE_SHIM_MATCHES=$(grep -rn --include="*.py" -E "(probe_llm_server\(|llm_server_responding_at\(|import.*\b(probe_llm_server|llm_server_responding_at)\b)" src/maxim/ \
            || true)
          if [ -n "$PROBE_SHIM_MATCHES" ]; then
            echo "ERROR: removed probe shim re-introduced"
            echo "$PROBE_SHIM_MATCHES"
            echo ""
            echo "Use _MaximPeerBackend.for_url(url, api_key=k, model=m).health_check()"
            exit 1
          fi
          # Plan 4 C3.1 + C3.2 mesh.yml writer allow list: write_mesh_config
          # is the only sanctioned writer of ~/.config/maxim/mesh.yml. The
          # C2 invariant ("mesh.yml is declarative; runtime code paths
          # are read-only") permits the explicit operator-invoked
          # one-shot setup verbs (init-mesh, add-node, remove-node) to
          # write mesh.yml but forbids automatic runtime / admin-API
          # writes. Strictly enforced: only mesh_setup.py + the test
          # files may CALL write_mesh_config; mesh_config.py itself
          # defines it but MUST NOT call it internally.
          #
          # Renamed init_mesh.py → mesh_setup.py + init_mesh test file
          # → test_mesh_setup.py in C3.2 when the file grew from one
          # verb to three.
          # Matches function CALLS (trailing "(") and from-imports.
          MESH_WRITER_MATCHES=$(grep -rn --include="*.py" -E "(write_mesh_config\(|from maxim\.peer\.mesh_config import .*\bwrite_mesh_config\b)" src/maxim/ tests/ \
            | grep -vE "^src/maxim/peer/mesh_setup\.py:" \
            | grep -vE "^src/maxim/peer/mesh_config\.py:.*def write_mesh_config" \
            | grep -vE "^tests/unit/test_mesh_setup\.py:" \
            | grep -vE "^tests/unit/test_mesh_config\.py:" \
            || true)
          if [ -n "$MESH_WRITER_MATCHES" ]; then
            echo "ERROR: new caller of write_mesh_config detected (Plan 4 C2/C3.1/C3.2)"
            echo "$MESH_WRITER_MATCHES"
            echo ""
            echo "mesh.yml is declarative state. The only sanctioned writers are the"
            echo "operator-invoked setup verbs in src/maxim/peer/mesh_setup.py"
            echo "(init-mesh, add-node, remove-node). C3 admin API + cluster key"
            echo "rotation + per-agent rate limiting MUST write to ~/.maxim/util/"
            echo "(the runtime mutable state layer), NEVER to mesh.yml."
            echo ""
            echo "If you have a legitimate new call site (e.g., a mesh-edit verb that"
            echo "extends operator setup workflows), update BOTH:"
            echo "  1. The allow list in .github/workflows/test.yml"
            echo "  2. The CLAUDE.md C2 invariant lesson"
            echo "in the same commit so the rule remains coherent."
            echo ""
            echo "See src/maxim/peer/mesh_config.py::write_mesh_config docstring for"
            echo "the full sanctioned-caller contract."
            echo "See feedback_strict_grep_caller_allowlist.md in memory for the"
            echo "tracked friction modes + when the rule needs revisiting."
            exit 1
          fi
          # Plan 4 C3.3 install_core single-source-of-truth rule:
          # install_on_target is the only CLIENT-side function that
          # POSTs to the leader's /v1/admin/install endpoint. Matches
          # the precedent set by _MaximPeerBackend.complete_with_usage
          # (Plan 3 R2.5) and write_mesh_config (Plan 4 C3.1): the
          # shared HTTP core has a strict allow-list so future C3.5
          # (--node update / --node restart), C3.6 (--node llm), and
          # admin API verbs cannot silently inline a copy.
          #
          # Allow-list rationale:
          # - install_core.py: the canonical client (where the rule
          #   points new callers).
          # - test_peer_install.py: regression assertions against the
          #   wire-level shape.
          # - leader_proxy.py: the SERVER side. The leader's admin
          #   endpoint handler must literally match the string to
          #   dispatch POST requests. Not a client caller — it's the
          #   receiver. A separate invariant would be needed to
          #   guard the server side; keeping leader_proxy in the
          #   allow-list keeps this grep scoped to "only one client."
          INSTALL_CORE_MATCHES=$(grep -rn --include="*.py" -F "/v1/admin/install" src/maxim/ tests/ \
            | grep -vE "^src/maxim/peer/install_core\.py:" \
            | grep -vE "^tests/unit/test_peer_install\.py:" \
            | grep -vE "^src/maxim/runtime/leader_proxy\.py:" \
            || true)
          if [ -n "$INSTALL_CORE_MATCHES" ]; then
            echo "ERROR: new caller of /v1/admin/install detected (Plan 4 C3.3)"
            echo "$INSTALL_CORE_MATCHES"
            echo ""
            echo "install_on_target in src/maxim/peer/install_core.py is the"
            echo "single source of truth for the /v1/admin/install wire shape"
            echo "(endpoint, headers, JSON body, timeout policy, error"
            echo "classification, exit codes, probe-cache clear). Do NOT inline"
            echo "a copy in C3.5 (--node update / --node restart), C3.6"
            echo "(--node llm), or any future admin API verb. Import"
            echo "install_on_target from peer/install_core instead."
            echo ""
            echo "If you have a legitimate new caller, update both:"
            echo "  1. The allow list in .github/workflows/test.yml"
            echo "  2. install_core.py's module docstring"
            echo "in the same commit so the rule stays coherent."
            exit 1
          fi
          # Plan 4 C3.5 admin_core single-source-of-truth rules:
          # update_on_target, restart_on_target, llm_swap_on_target are
          # the only CLIENT-side functions that POST to the leader's
          # admin endpoints. Same pattern as install_core (C3.3).
          ADMIN_UPDATE_MATCHES=$(grep -rn --include="*.py" -F "/v1/admin/update" src/maxim/ tests/ \
            | grep -vE "^src/maxim/peer/admin_core\.py:" \
            | grep -vE "^tests/unit/test_admin_core\.py:" \
            | grep -vE "^src/maxim/runtime/leader_proxy\.py:" \
            || true)
          if [ -n "$ADMIN_UPDATE_MATCHES" ]; then
            echo "ERROR: new caller of /v1/admin/update detected (Plan 4 C3.5)"
            echo "$ADMIN_UPDATE_MATCHES"
            echo ""
            echo "update_on_target in src/maxim/peer/admin_core.py is the"
            echo "single source of truth for the /v1/admin/update wire shape."
            echo "Import update_on_target from peer/admin_core instead."
            exit 1
          fi
          ADMIN_RESTART_MATCHES=$(grep -rn --include="*.py" -F "/v1/admin/restart" src/maxim/ tests/ \
            | grep -vE "^src/maxim/peer/admin_core\.py:" \
            | grep -vE "^tests/unit/test_admin_core\.py:" \
            | grep -vE "^src/maxim/runtime/leader_proxy\.py:" \
            || true)
          if [ -n "$ADMIN_RESTART_MATCHES" ]; then
            echo "ERROR: new caller of /v1/admin/restart detected (Plan 4 C3.5)"
            echo "$ADMIN_RESTART_MATCHES"
            echo ""
            echo "restart_on_target in src/maxim/peer/admin_core.py is the"
            echo "single source of truth for the /v1/admin/restart wire shape."
            echo "Import restart_on_target from peer/admin_core instead."
            exit 1
          fi
          ADMIN_LLM_MATCHES=$(grep -rn --include="*.py" -F "/v1/admin/llm-swap" src/maxim/ tests/ \
            | grep -vE "^src/maxim/peer/admin_core\.py:" \
            | grep -vE "^tests/unit/test_admin_core\.py:" \
            | grep -vE "^src/maxim/runtime/leader_proxy\.py:" \
            | grep -vE "^src/maxim/runtime/lane_backends\.py:.*Called by LeaderProxy" \
            || true)
          if [ -n "$ADMIN_LLM_MATCHES" ]; then
            echo "ERROR: new caller of /v1/admin/llm-swap detected (Plan 4 C3.6)"
            echo "$ADMIN_LLM_MATCHES"
            echo ""
            echo "llm_swap_on_target in src/maxim/peer/admin_core.py is the"
            echo "single source of truth for the /v1/admin/llm-swap wire shape."
            echo "Import llm_swap_on_target from peer/admin_core instead."
            exit 1
          fi
          # config_unification.md C2 + C6 invariants (IM2 fold).
          # runtime/config_writer.py defines the canonical writer
          # surface (write_config / mutate_config / set_field). The
          # allow-list below enumerates the only modules that may
          # call those functions. Mirror of the
          # write_mesh_config / mesh_setup.py pattern: operator-
          # explicit one-shot setup verbs only — automatic runtime /
          # admin-API writes to declarative config files are forbidden.
          CONFIG_WRITER_MATCHES=$(grep -rn --include="*.py" -E "\b(write_config|mutate_config|set_field|unset_field|downgrade_config|restore_preserved)\(" src/maxim/ tests/ \
            | grep -vE "^src/maxim/runtime/config_writer\.py:" \
            | grep -vE "^src/maxim/runtime/config_cli\.py:" \
            | grep -vE "^src/maxim/runtime/config_loader\.py:.*written = write_config" \
            | grep -vE "^src/maxim/peer/cli\.py:" \
            | grep -vE "^tests/unit/test_config_writer\.py:" \
            | grep -vE "^tests/unit/test_config_cli\.py:" \
            | grep -vE "^tests/unit/test_config_loader\.py:" \
            | grep -vE "^tests/unit/test_lane_routing_via_config\.py:" \
            | grep -vE "^tests/unit/test_doctor_resolved_config\.py:" \
            | grep -vE "^tests/unit/test_role_unification\.py:" \
            | grep -vE "^tests/unit/test_memory_strategy_config\.py:" \
            | grep -vE "^tests/unit/test_config_format_version_856\.py:" \
            | grep -vE "^tests/unit/test_config_downgrade_974\.py:" \
            | grep -vE "^tests/unit/test_config_sparse_1_2\.py:" \
            || true)
          if [ -n "$CONFIG_WRITER_MATCHES" ]; then
            echo "ERROR: new caller of config_writer.write_config / mutate_config / set_field / downgrade_config / restore_preserved detected (config_unification.md IM2)"
            echo "$CONFIG_WRITER_MATCHES"
            exit 1
          fi
          # Post-merge review round 2026-07-26 (Arch #3): the setup verbs
          # (apply_mesh_setup / apply_cloud_setup) are un-grepped WRAPPERS of
          # the writer surface — without their own caller gate any module
          # could mutate config.json through them, silently bypassing the
          # single-writer boundary above. Allow-list: the console's operator-
          # explicit setup endpoints + tests.
          SETUP_VERB_MATCHES=$(grep -rn --include="*.py" -E "\bapply_(mesh|cloud)_setup\(" src/maxim/ tests/ \
            | grep -vE "^src/maxim/runtime/config_writer\.py:" \
            | grep -vE "^src/maxim/console/server\.py:" \
            | grep -vE "^tests/unit/test_config_writer\.py:" \
            | grep -vE "^tests/unit/test_console_server\.py:" \
            | grep -vE "^tests/unit/test_console_launcher_seams\.py:" \
            | grep -vE "^tests/unit/test_config_sparse_1_2\.py:" \
            || true)
          if [ -n "$SETUP_VERB_MATCHES" ]; then
            echo "ERROR: new caller of apply_mesh_setup / apply_cloud_setup detected (single-writer boundary, post-merge round 2026-07-26)"
            echo "$SETUP_VERB_MATCHES"
            echo ""
            echo "runtime/config_writer.py is the only sanctioned writer of"
            echo "~/.config/maxim/config.json. Mirror the mesh_setup.py /"
            echo "write_mesh_config pattern — operator-explicit one-shot"
            echo "setup verbs only; automatic runtime / admin-API writes"
            echo "to declarative config files are forbidden."
            echo ""
            echo "If you have a legitimate new caller (e.g., a new maxim"
            echo "config verb), update both:"
            echo "  1. The allow list in .github/workflows/test.yml"
            echo "  2. The config_writer.py module docstring"
            echo "in the same commit so the rule stays coherent."
            exit 1
          fi
          # config_unification.md cross-confirmed I-3/IM3 fold: inline
          # plaintext API keys must never appear in test fixtures. The
          # repo-wide grep catches sk-/gsk_/AKIA/xoxb- patterns. Only
          # quoted SAMPLE-WITHIN-TEST-CODE matches like
          # `set_field("...remote_api_key_ref", "sk-...")` for testing
          # the rejection path are allowed.
          if grep -rnE '"remote_api_key_ref"[^:]*:\s*"(sk-|gsk_|AKIA|xoxb-)' tests/fixtures/ 2>/dev/null; then
            echo "ERROR: inline plaintext API key in tests/fixtures/ (config_unification.md I-3/IM3)"
            echo ""
            echo "Lane API key references must be file paths or keyring URIs."
            echo "Sample keys for testing rejection paths should be inside"
            echo "test code (tests/unit/), not committed in fixtures."
            exit 1
          fi
          # C6 hard-error allow list (PR #301, 2026-05-29): PainBus /
          # ReactionBus / MemoryHub raw construction without
          # _allow_raw=True now raises TypeError. The keyword survives
          # as the structural opt-out for tests. Production code goes
          # through the canonical builders (build_pain_bus /
          # build_reaction_bus / build_memory_hub) which pass
          # _allow_raw=True internally. The only legitimate src/maxim/
          # production opt-out is DefaultNetwork's raw PainBus
          # construction, deferred to the Wave-2
          # memory_hub_unification follow-on (split-subscriber-ownership
          # fix). New _allow_raw=True production sites are an
          # architectural decision and require explicit allow-list
          # update + CLAUDE.md rationale.
          #
          # Match `_allow_raw=True` ONLY on lines where it appears as a
          # kwarg in a call: at line-start (after indentation), after a
          # comma, or after `(`. This excludes docstring/string text like
          # `"may pass _allow_raw=True"`.
          ALLOW_RAW_MATCHES=$(grep -rnE --include="*.py" "^\s*_allow_raw=True|, _allow_raw=True|\(_allow_raw=True" src/maxim/ \
            | grep -vE "^src/maxim/integration/memory_hub\.py:[0-9]+:        _allow_raw=True," \
            | grep -vE "^src/maxim/proprioception/pain_bus\.py:[0-9]+:            _allow_raw=True," \
            | grep -vE "^src/maxim/reactions/bus\.py:[0-9]+:        _allow_raw=True," \
            | grep -vE "^src/maxim/default_network/network\.py:.*PainBus\(_allow_raw=True\)" \
            || true)
          if [ -n "$ALLOW_RAW_MATCHES" ]; then
            echo "ERROR: new _allow_raw=True opt-out in src/maxim/ detected (v0.9 C6)"
            echo "$ALLOW_RAW_MATCHES"
            echo ""
            echo "Production code MUST go through build_pain_bus / build_reaction_bus /"
            echo "build_memory_hub. The builders pass _allow_raw=True internally."
            echo ""
            echo "If you have a legitimate new opt-out (rare — usually means a"
            echo "deferred Wave-N follow-on like DefaultNetwork's), update BOTH:"
            echo "  1. The allow list in .github/workflows/test.yml"
            echo "  2. CLAUDE.md (the corresponding bus's lesson section)"
            echo "in the same commit, with a TODO(wave-N) comment at the call site."
            echo ""
            echo "See docs/plans/archive/v1_refinement.md §C6 + §1.1-T4 for the deprecation"
            echo "cycle + 1.0 hard-error flip."
            exit 1
          fi
          # v1 C4-followup-1 LLM-spec normalizer rule: any caller of
          # _parse_entity outside the four sanctioned non-LLM input
          # sources (defining/recursive use in embodiment/spec.py,
          # bundled YAML pass-through in component_registry.py,
          # user-authored DM YAML in campaign_runner.py, curated arc
          # data in generative_runner.py) MUST also call
          # normalize_llm_entity_spec on the spec. Bundled + user-YAML
          # sources are AUDITED — they declare `abstract: true`
          # explicitly so the user-migration signal (C4 deprecation
          # warning, 1.0 ConfigurationError) reaches the author. LLM
          # specs are NOT audited — the normalizer auto-fills the
          # missing marker so LLM forgetfulness doesn't crash the
          # imagined / foundry-generated paths.
          #
          # Match `_parse_entity(` calls (excluding the function
          # definition signature) and require either an allow-listed
          # file OR the normalizer on the same line / nearby. Per-file
          # allow-list is the load-bearing structural enforcement;
          # adding a new entry without updating both the allow-list
          # and CLAUDE.md is the canonical "silent-no-op" trap this
          # guard exists to close.
          #
          # See docs/plans/archive/v1_refinement.md §C4 followup-1.
          # Match assignment-form calls only (`x = _parse_entity(`) so
          # docstring/comment mentions like "ready for _parse_entity()"
          # do not false-positive.
          PARSE_ENTITY_MATCHES=$(grep -rnE --include="*.py" "=\s*_parse_entity\(" src/maxim/ \
            | grep -vE "^src/maxim/embodiment/spec\.py:" \
            | grep -vE "^src/maxim/embodiment/component_registry\.py:" \
            | grep -vE "^src/maxim/simulation/campaign_runner\.py:" \
            | grep -vE "^src/maxim/simulation/generative_runner\.py:" \
            | grep -vE "normalize_llm_entity_spec" \
            || true)
          if [ -n "$PARSE_ENTITY_MATCHES" ]; then
            echo "ERROR: new _parse_entity caller outside the C4-followup-1 allow list detected"
            echo "$PARSE_ENTITY_MATCHES"
            echo ""
            echo "LLM-derived entity specs (imagination, foundry, ...) MUST route through"
            echo "maxim.embodiment.spec.normalize_llm_entity_spec(spec) before _parse_entity"
            echo "so the C4 hard-error flip doesn't reject LLM forgetfulness about the"
            echo "modulator.abstract=true marker."
            echo ""
            echo "If you have a legitimate new non-LLM caller (e.g., a new bundled-YAML"
            echo "loader where the user-migration signal should reach the author), update BOTH:"
            echo "  1. The allow list in .github/workflows/test.yml"
            echo "  2. CLAUDE.md (the C4-followup-1 invariant)"
            echo "in the same commit, with a comment naming the input source class."
            echo ""
            echo "See src/maxim/embodiment/spec.py::normalize_llm_entity_spec docstring."
            exit 1
          fi
          # optional_deps single-source-of-truth: a missing optional
          # dependency must not silently degrade behavior. The anti-pattern
          # is `except ImportError:` immediately followed by `<name> = None`
          # (a silent no-op fallback). New code must route through
          # maxim/utils/optional_deps.py — require_optional_dependency (fail
          # loud), optional_dependency_available (capability probe), or
          # warn_optional_fallback (degrade WITH a one-time notice). The
          # allow-list is the set of pre-existing grandfathered sites; most
          # are benign UI fallbacks (rich -> plain). Detects the assignment
          # on the line immediately after the except (grep -A1).
          SILENT_IMPORT_MATCHES=$(grep -rn --include="*.py" -A1 "except ImportError" src/maxim/ \
            | grep -E "[:-][0-9]+[-:][[:space:]]*[A-Za-z_][A-Za-z0-9_.]*[[:space:]]*=[[:space:]]*None\b" \
            | grep -vE "^src/maxim/(cli|comms/api|inference/segment_vision|interactive/prompts|runtime/agent_loop|runtime/agent_pool|similarity/__init__|similarity/ec|tools/internet_search)\.py-" \
            || true)
          if [ -n "$SILENT_IMPORT_MATCHES" ]; then
            echo "ERROR: silent optional-dependency fallback ('except ImportError: X = None')"
            echo "$SILENT_IMPORT_MATCHES"
            echo ""
            echo "Use maxim/utils/optional_deps.py instead of a silent None fallback:"
            echo "  - require_optional_dependency(...)  → fail loud with an install hint"
            echo "  - optional_dependency_available(...) → capability probe (no error)"
            echo "  - warn_optional_fallback(...)        → degrade WITH a one-time notice"
            echo ""
            echo "If a new silent fallback is genuinely benign (e.g. a cosmetic"
            echo "UI fallback), update BOTH:"
            echo "  1. The allow list in .github/workflows/test.yml"
            echo "  2. The optional_deps invariant in CLAUDE.md"
            echo "in the same commit so the rule stays coherent."
            exit 1
          fi
          echo "CI grep invariants clean"

      - name: CI grep invariants (1.0 guard promotion — NAc name, backend imports, raw_proxy_forward, tier names, deleted energy classes)
        run: |
          # CLAUDE.md "NAc class name" lesson: the class is NAc
          # (decisions/nac.py), NOT NucleusAccumbens. A stale reference
          # under `if TYPE_CHECKING:` is silent at runtime (this exact
          # bug shipped in agents/exec_agent.py and lived until the 1.0
          # guard audit found it).
          if grep -rn --include="*.py" "NucleusAccumbens" src/maxim/; then
            echo "ERROR: NucleusAccumbens referenced — the class is NAc (src/maxim/decisions/nac.py)."
            exit 1
          fi
          # CLAUDE.md "LLM access goes through models/language/router.py":
          # concrete backends must not be imported outside models/language/.
          # _MaximPeerBackend is exempt — for_url(...).health_check() is the
          # canonical probe entry point with its own CI-audited call sites.
          # Allow list:
          #   - agents/llm_agent.py: grandfathered — LLMAgent is a
          #     pre-router standalone llama.cpp agent still wired into
          #     simulation_generator/interactive. Migrating it onto the
          #     router is tracked follow-up work, not a drive-by change.
          #   - agents/exec_agent.py: line-scoped to the PROPOSED_GOAL_TOOL
          #     constant import only (a future backend-class import in the
          #     same file still fails).
          # Scope note: matches the `from maxim.models.language.X import`
          # form only (the codebase-wide convention); `import maxim.models.
          # language.X` and relative-import forms are out of scope for this
          # first guard.
          # Positive control: the pattern must keep matching the two
          # allow-listed sites pre-filter — if the regex rots (module
          # rename, import-style migration), fail loudly instead of
          # passing vacuously forever.
          BACKEND_IMPORT_ALL=$(grep -rnE --include="*.py" "from maxim\.models\.language\.(anthropic_backend|llama_backend|openai_backend|transformers_backend) import" src/maxim/ || true)
          if ! echo "$BACKEND_IMPORT_ALL" | grep -q "^src/maxim/agents/llm_agent\.py:"; then
            echo "ERROR: backend-import grep positive control failed — pattern no longer matches the"
            echo "       grandfathered agents/llm_agent.py site. Either llm_agent migrated to the"
            echo "       router (remove it from the allow list + this control) or the regex rotted."
            exit 1
          fi
          BACKEND_IMPORT_MATCHES=$(echo "$BACKEND_IMPORT_ALL" \
            | grep -v "^src/maxim/models/language/" \
            | grep -v "^src/maxim/agents/llm_agent\.py:" \
            | grep -vE "^src/maxim/agents/exec_agent\.py:.*PROPOSED_GOAL_TOOL" \
            || true)
          if [ -n "$BACKEND_IMPORT_MATCHES" ]; then
            echo "ERROR: concrete LLM backend imported outside models/language/"
            echo "$BACKEND_IMPORT_MATCHES"
            echo ""
            echo "Route through models/language/router.py + runtime/lane_backends.BACKEND_CLASSES."
            echo "If genuinely sanctioned, update the allow list here AND the CLAUDE.md invariant."
            exit 1
          fi
          # CLAUDE.md: raw_proxy_forward / raw_proxy_forward_streaming are
          # reserved for leader_proxy._proxy_request ONLY.
          if grep -rn --include="*.py" "raw_proxy_forward" src/maxim/ | grep -vE "^src/maxim/(runtime/leader_proxy|utils/http)\.py:"; then
            echo "ERROR: raw_proxy_forward used outside leader_proxy.py / utils/http.py"
            exit 1
          fi
          # CLAUDE.md "Lane tier names": canonical names are large/medium/
          # small; legacy infer/review/record string literals must not
          # reappear in lane_models.py.
          if grep -nE "\"(infer|review|record)\"|'(infer|review|record)'" src/maxim/runtime/lane_models.py; then
            echo "ERROR: legacy tier-name string literal in lane_models.py (use large/medium/small)"
            exit 1
          fi
          # CLAUDE.md embodiment-tick invariant: Body.evaluate_failures owns
          # the wall-clock drive-drift tick. A second tick_vital_drift call
          # site would double-drift (ed8b187f removed the percepts.py
          # duplicate for exactly this). Only body.py may call it.
          TICK_MATCHES=$(grep -rn --include="*.py" "tick_vital_drift(" src/maxim/ \
            | grep -v "^src/maxim/embodiment/body\.py:" \
            || true)
          if [ -n "$TICK_MATCHES" ]; then
            echo "ERROR: tick_vital_drift called outside embodiment/body.py — double-drift hazard"
            echo "$TICK_MATCHES"
            echo "       The tick lives in Body.evaluate_failures (see the CLAUDE.md embodiment-tick invariant)."
            exit 1
          fi
          # CLAUDE.md cradle Stage 1c: EnergyReactionBridge and
          # MovementEnergyTracker are hard-deleted dead code.
          if grep -rn --include="*.py" "EnergyReactionBridge\|MovementEnergyTracker" src/maxim/; then
            echo "ERROR: deleted energy classes referenced (EnergyReactionBridge/MovementEnergyTracker)"
            exit 1
          fi
          # 2026-08-07 orient workspace-safety fold: raw SDK motion dispatch
          # (mini.goto_target / mini.set_target / mini.look_at_image) is
          # restricted to the two sanctioned primitives — the controller
          # (hardware/reachy/controller.py, clamps + motion lock) and
          # motion/movement.py (move_head: frame composition + rotation
          # clamps; move_antenna). One additional reference is allow-listed:
          # embodied_runtime/movement.py's _enqueue_sdk_look_at (the SDK's
          # own IK-managed look_at path) — since the 2026-08-09 F1
          # retained-axes fold that site binds the SDK fn to a local
          # (sdk_look_at = self.mini.look_at_image) so a wrapper can
          # invalidate the controller's last-commanded stash around the
          # dispatch; both the old direct-enqueue shape and the new binding
          # shape are allow-listed. A new hand-rolled raw dispatch is
          # the motor-destruction failure class (motors 2+3, hardware note
          # in docs/plans/roadmap_1_1_to_1_3.md).
          RAW_SDK_MOTION=$(grep -rnE --include="*.py" "mini\.(goto_target|set_target|look_at_image)" src/maxim/ \
            | grep -v "^src/maxim/hardware/reachy/controller\.py:" \
            | grep -v "^src/maxim/motion/movement\.py:" \
            | grep -vE "^src/maxim/embodied_runtime/movement\.py:[0-9]+: *self\._enqueue_motor\(self\.mini\.look_at_image" \
            | grep -vE "^src/maxim/embodied_runtime/movement\.py:[0-9]+: *sdk_look_at = self\.mini\.look_at_image" \
            | grep -vE "^[^:]+:[0-9]+: *#" \
            || true)
          if [ -n "$RAW_SDK_MOTION" ]; then
            echo "ERROR: raw SDK motion dispatch outside the sanctioned primitives"
            echo "$RAW_SDK_MOTION"
            echo "       Route through ReachyMiniController.goto_target (clamps + lock) or"
            echo "       Selfy.move()'s clamped enqueue. See docs/embodiment/reachy_mini/orient_vocabulary_audit.md."
            exit 1
          fi
          echo "1.0 promoted grep invariants clean"

