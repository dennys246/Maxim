name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Lets the slow aarch64 real-install job be run on demand (it is skipped on
  # PRs). Without this its `github.event_name == 'workflow_dispatch'` condition
  # could never fire, so the job would only ever execute post-merge on main.
  workflow_dispatch:

# Supersede in-flight runs for the same ref instead of letting them compete
# for runners (2026-08-06 CI starvation incident).
#
# WHAT HAPPENED: with several PRs open and pushed in quick succession, jobs
# were created but NEVER ASSIGNED A RUNNER (`runner_name: ""`), sat in the
# queue, and were killed at exactly 15m01s with zero steps executed. They
# surfaced as `failure` in `gh pr checks`, indistinguishable from real test
# failures — five PRs looked red while the only PR with source changes was
# green. Healthy runs are ~12 min of real work (3m45s install + 7m43s tests),
# so this was not slowness; it was demand. Every push previously left its
# predecessor's run alive, so N pushes to one branch competed for N times the
# slots.
#
# `cancel-in-progress` is deliberately FALSE on main: a superseded main run
# must still complete, because main's CI result is what the release gate and
# the post-merge verification read. Only PR-branch runs are cancellable.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgstreamer1.0-dev gstreamer1.0-plugins-base

      - name: Install package and test dependencies
        run: |
          pip install pytest pytest-cov pytest-xdist
          # Install without deps first (reachy-mini requires robot hardware SDK),
          # then install available deps separately
          pip install --no-deps -e .
          pip install faster-whisper ctranslate2 onnxruntime av numpy opencv-python scipy llama-cpp-python ddgs pyyaml || echo "Some optional deps unavailable on CI"

      - name: mypy public API surface
        # CLAUDE.md required check, promoted to CI (1.0 guard promotion).
        # --follow-imports=silent scopes error reporting to the five public
        # API files; the rest of the codebase is not mypy-clean yet.
        # Pinned so a mypy release can't break CI on its own. Runs before
        # the test suite for faster failure feedback.
        run: |
          pip install "mypy==1.20.0"
          mypy src/maxim/__init__.py src/maxim/api.py src/maxim/session.py \
               src/maxim/create.py src/maxim/load.py \
               --ignore-missing-imports --follow-imports=silent

      - name: Run unit tests
        run: python -m pytest tests/unit/ -x -q -m "not slow" --tb=short

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ruff lint + format check
        # CLAUDE.md required checks, promoted to CI (1.0 guard promotion).
        # Pinned so a ruff release's new rules/format changes can't break
        # CI on their own — bump the pin deliberately alongside a
        # ruff check/format pass in the same commit.
        run: |
          pip install "ruff==0.14.14"
          ruff check src/ tests/
          ruff format --check src/ tests/

      - name: Version sync (pyproject.toml == src/maxim/__init__.py)
        # CLAUDE.md "Versioning": the two version declarations must stay
        # in sync. Promoted from a manual check to CI (1.0 guard promotion).
        run: |
          python3 - <<'EOF'
          import re, sys, tomllib

          with open("pyproject.toml", "rb") as f:
              pyproject_version = tomllib.load(f)["project"]["version"]
          init_src = open("src/maxim/__init__.py").read()
          m = re.search(r'^__version__\s*=\s*"([^"]+)"', init_src, re.MULTILINE)
          if m is None:
              sys.exit("ERROR: __version__ not found in src/maxim/__init__.py")
          init_version = m.group(1)
          if pyproject_version != init_version:
              sys.exit(
                  f"ERROR: version drift — pyproject.toml={pyproject_version!r} "
                  f"vs src/maxim/__init__.py={init_version!r}. "
                  "Bump both in the same commit (CLAUDE.md 'Versioning')."
              )
          print(f"Version sync OK: {pyproject_version}")
          EOF

      - name: Check all Python files parse
        run: |
          python -c "
          import ast, sys, pathlib
          errors = []
          for p in pathlib.Path('src/maxim').rglob('*.py'):
              try:
                  ast.parse(p.read_text())
              except SyntaxError as e:
                  errors.append(f'{p}: {e}')
          if errors:
              print('\n'.join(errors))
              sys.exit(1)
          print(f'All {len(list(pathlib.Path(\"src/maxim\").rglob(\"*.py\")))} files parse OK')
          "

      - name: CI grep invariants (urllib + dead mesh modules + Plan 3 no-retry-loop + deprecated probe shims)
        run: |
          if grep -rn "urllib.request.urlopen" src/maxim/ | grep -v "utils/http.py"; then
            echo "ERROR: raw urllib.request.urlopen outside utils/http.py"
            exit 1
          fi
          if grep -rnE "from maxim\.mesh\.(peer_registry|peer_info|peer_channel|task_delegation|knowledge|clock|agent_identity|admission)" src/maxim/ tests/; then
            echo "ERROR: import from deleted mesh modules"
            exit 1
          fi
          # Plan 3 R2.5 no-retry-loop invariant: _MaximPeerBackend must
          # never grow an internal repeat loop. The `retry_after_s` and
          # `retry_timeout_s` parameter names are contractual (they
          # match BackendOverloaded + the pre-R2.6 probe signature) and
          # are the only permitted matches.
          if grep -nE "retry|backoff|gateway" src/maxim/models/language/maxim_peer_backend.py | grep -vE "retry_after_s|retry_timeout_s"; then
            echo "ERROR: Plan 3 no-retry-loop invariant violated in maxim_peer_backend.py"
            echo "       _MaximPeerBackend makes EXACTLY one HTTP call per complete_with_usage."
            echo "       Failover is the router's job. See docs/plans/archive/llm_path_fast_failover.md."
            exit 1
          fi
          # stall_detector_timeout_awareness.md invariant: new stall
          # detectors MUST consult runtime/stall_threshold.py rather than
          # defining their own hardcoded 30s threshold. Matches literal
          # patterns like `STALL_S = 30` or `stall_threshold = 30` outside
          # the canonical module + its tests. Pure 30-as-non-stall integers
          # in unrelated contexts won't match because the rule requires
          # "STALL" in the assigned name.
          STALL_LITERAL_MATCHES=$(grep -rnE "(STALL[A-Z_]*|stall[a-z_]*threshold)\s*=\s*30(\.0)?\b" \
              --include="*.py" src/maxim/ \
            | grep -vE "^src/maxim/runtime/stall_threshold\.py:" \
            | grep -vE "^src/maxim/runtime/heartbeat\.py:" \
            || true)
          # heartbeat.py allowlisted: Stage 2 of stall_detector_timeout_awareness.md
          # migrates heartbeat to compute_stall_threshold via opt-in
          # MAXIM_HEARTBEAT_USE_LANE_TIMEOUT; target 1.0.x.
          if [ -n "$STALL_LITERAL_MATCHES" ]; then
            echo "ERROR: hardcoded 30s stall threshold outside runtime/stall_threshold.py:"
            echo "$STALL_LITERAL_MATCHES"
            echo "       Use compute_stall_threshold() from runtime/stall_threshold.py"
            echo "       See docs/plans/deferred/stall_detector_timeout_awareness.md."
            exit 1
          fi
          # leader_ux_profile_management.md L2 + L3 invariant: every
          # module that reads ~/.config/maxim/profiles.yml must use
          # yaml.safe_load exclusively. yaml.load allows arbitrary
          # Python object construction via untrusted YAML — a hard
          # security boundary at the operator-config layer.
          for f in \
              src/maxim/models/language/profile_loader.py \
              src/maxim/models/model_cli.py; do
            if grep -nE "yaml\.load\(" "$f" | grep -v "yaml.safe_load"; then
              echo "ERROR: $f uses bare yaml.load() — must use yaml.safe_load()"
              exit 1
            fi
          done
          # Probe shims removed (v1 cleanup C1). probe_llm_server,
          # llm_server_responding_at, and _probe_once were moved/deleted.
          # Probe primitives now live in maxim_peer_backend.py. Block any
          # re-introduction of the old shim names in production code.
          PROBE_SHIM_MATCHES=$(grep -rn --include="*.py" -E "(probe_llm_server\(|llm_server_responding_at\(|import.*\b(probe_llm_server|llm_server_responding_at)\b)" src/maxim/ \
            || true)
          if [ -n "$PROBE_SHIM_MATCHES" ]; then
            echo "ERROR: removed probe shim re-introduced"
            echo "$PROBE_SHIM_MATCHES"
            echo ""
            echo "Use _MaximPeerBackend.for_url(url, api_key=k, model=m).health_check()"
            exit 1
          fi
          # Plan 4 C3.1 + C3.2 mesh.yml writer allow list: write_mesh_config
          # is the only sanctioned writer of ~/.config/maxim/mesh.yml. The
          # C2 invariant ("mesh.yml is declarative; runtime code paths
          # are read-only") permits the explicit operator-invoked
          # one-shot setup verbs (init-mesh, add-node, remove-node) to
          # write mesh.yml but forbids automatic runtime / admin-API
          # writes. Strictly enforced: only mesh_setup.py + the test
          # files may CALL write_mesh_config; mesh_config.py itself
          # defines it but MUST NOT call it internally.
          #
          # Renamed init_mesh.py → mesh_setup.py + init_mesh test file
          # → test_mesh_setup.py in C3.2 when the file grew from one
          # verb to three.
          # Matches function CALLS (trailing "(") and from-imports.
          MESH_WRITER_MATCHES=$(grep -rn --include="*.py" -E "(write_mesh_config\(|from maxim\.peer\.mesh_config import .*\bwrite_mesh_config\b)" src/maxim/ tests/ \
            | grep -vE "^src/maxim/peer/mesh_setup\.py:" \
            | grep -vE "^src/maxim/peer/mesh_config\.py:.*def write_mesh_config" \
            | grep -vE "^tests/unit/test_mesh_setup\.py:" \
            | grep -vE "^tests/unit/test_mesh_config\.py:" \
            || true)
          if [ -n "$MESH_WRITER_MATCHES" ]; then
            echo "ERROR: new caller of write_mesh_config detected (Plan 4 C2/C3.1/C3.2)"
            echo "$MESH_WRITER_MATCHES"
            echo ""
            echo "mesh.yml is declarative state. The only sanctioned writers are the"
            echo "operator-invoked setup verbs in src/maxim/peer/mesh_setup.py"
            echo "(init-mesh, add-node, remove-node). C3 admin API + cluster key"
            echo "rotation + per-agent rate limiting MUST write to ~/.maxim/util/"
            echo "(the runtime mutable state layer), NEVER to mesh.yml."
            echo ""
            echo "If you have a legitimate new call site (e.g., a mesh-edit verb that"
            echo "extends operator setup workflows), update BOTH:"
            echo "  1. The allow list in .github/workflows/test.yml"
            echo "  2. The CLAUDE.md C2 invariant lesson"
            echo "in the same commit so the rule remains coherent."
            echo ""
            echo "See src/maxim/peer/mesh_config.py::write_mesh_config docstring for"
            echo "the full sanctioned-caller contract."
            echo "See feedback_strict_grep_caller_allowlist.md in memory for the"
            echo "tracked friction modes + when the rule needs revisiting."
            exit 1
          fi
          # Plan 4 C3.3 install_core single-source-of-truth rule:
          # install_on_target is the only CLIENT-side function that
          # POSTs to the leader's /v1/admin/install endpoint. Matches
          # the precedent set by _MaximPeerBackend.complete_with_usage
          # (Plan 3 R2.5) and write_mesh_config (Plan 4 C3.1): the
          # shared HTTP core has a strict allow-list so future C3.5
          # (--node update / --node restart), C3.6 (--node llm), and
          # admin API verbs cannot silently inline a copy.
          #
          # Allow-list rationale:
          # - install_core.py: the canonical client (where the rule
          #   points new callers).
          # - test_peer_install.py: regression assertions against the
          #   wire-level shape.
          # - leader_proxy.py: the SERVER side. The leader's admin
          #   endpoint handler must literally match the string to
          #   dispatch POST requests. Not a client caller — it's the
          #   receiver. A separate invariant would be needed to
          #   guard the server side; keeping leader_proxy in the
          #   allow-list keeps this grep scoped to "only one client."
          INSTALL_CORE_MATCHES=$(grep -rn --include="*.py" -F "/v1/admin/install" src/maxim/ tests/ \
            | grep -vE "^src/maxim/peer/install_core\.py:" \
            | grep -vE "^tests/unit/test_peer_install\.py:" \
            | grep -vE "^src/maxim/runtime/leader_proxy\.py:" \
            || true)
          if [ -n "$INSTALL_CORE_MATCHES" ]; then
            echo "ERROR: new caller of /v1/admin/install detected (Plan 4 C3.3)"
            echo "$INSTALL_CORE_MATCHES"
            echo ""
            echo "install_on_target in src/maxim/peer/install_core.py is the"
            echo "single source of truth for the /v1/admin/install wire shape"
            echo "(endpoint, headers, JSON body, timeout policy, error"
            echo "classification, exit codes, probe-cache clear). Do NOT inline"
            echo "a copy in C3.5 (--node update / --node restart), C3.6"
            echo "(--node llm), or any future admin API verb. Import"
            echo "install_on_target from peer/install_core instead."
            echo ""
            echo "If you have a legitimate new caller, update both:"
            echo "  1. The allow list in .github/workflows/test.yml"
            echo "  2. install_core.py's module docstring"
            echo "in the same commit so the rule stays coherent."
            exit 1
          fi
          # Plan 4 C3.5 admin_core single-source-of-truth rules:
          # update_on_target, restart_on_target, llm_swap_on_target are
          # the only CLIENT-side functions that POST to the leader's
          # admin endpoints. Same pattern as install_core (C3.3).
          ADMIN_UPDATE_MATCHES=$(grep -rn --include="*.py" -F "/v1/admin/update" src/maxim/ tests/ \
            | grep -vE "^src/maxim/peer/admin_core\.py:" \
            | grep -vE "^tests/unit/test_admin_core\.py:" \
            | grep -vE "^src/maxim/runtime/leader_proxy\.py:" \
            || true)
          if [ -n "$ADMIN_UPDATE_MATCHES" ]; then
            echo "ERROR: new caller of /v1/admin/update detected (Plan 4 C3.5)"
            echo "$ADMIN_UPDATE_MATCHES"
            echo ""
            echo "update_on_target in src/maxim/peer/admin_core.py is the"
            echo "single source of truth for the /v1/admin/update wire shape."
            echo "Import update_on_target from peer/admin_core instead."
            exit 1
          fi
          ADMIN_RESTART_MATCHES=$(grep -rn --include="*.py" -F "/v1/admin/restart" src/maxim/ tests/ \
            | grep -vE "^src/maxim/peer/admin_core\.py:" \
            | grep -vE "^tests/unit/test_admin_core\.py:" \
            | grep -vE "^src/maxim/runtime/leader_proxy\.py:" \
            || true)
          if [ -n "$ADMIN_RESTART_MATCHES" ]; then
            echo "ERROR: new caller of /v1/admin/restart detected (Plan 4 C3.5)"
            echo "$ADMIN_RESTART_MATCHES"
            echo ""
            echo "restart_on_target in src/maxim/peer/admin_core.py is the"
            echo "single source of truth for the /v1/admin/restart wire shape."
            echo "Import restart_on_target from peer/admin_core instead."
            exit 1
          fi
          ADMIN_LLM_MATCHES=$(grep -rn --include="*.py" -F "/v1/admin/llm-swap" src/maxim/ tests/ \
            | grep -vE "^src/maxim/peer/admin_core\.py:" \
            | grep -vE "^tests/unit/test_admin_core\.py:" \
            | grep -vE "^src/maxim/runtime/leader_proxy\.py:" \
            | grep -vE "^src/maxim/runtime/lane_backends\.py:.*Called by LeaderProxy" \
            || true)
          if [ -n "$ADMIN_LLM_MATCHES" ]; then
            echo "ERROR: new caller of /v1/admin/llm-swap detected (Plan 4 C3.6)"
            echo "$ADMIN_LLM_MATCHES"
            echo ""
            echo "llm_swap_on_target in src/maxim/peer/admin_core.py is the"
            echo "single source of truth for the /v1/admin/llm-swap wire shape."
            echo "Import llm_swap_on_target from peer/admin_core instead."
            exit 1
          fi
          # config_unification.md C2 + C6 invariants (IM2 fold).
          # runtime/config_writer.py defines the canonical writer
          # surface (write_config / mutate_config / set_field). The
          # allow-list below enumerates the only modules that may
          # call those functions. Mirror of the
          # write_mesh_config / mesh_setup.py pattern: operator-
          # explicit one-shot setup verbs only — automatic runtime /
          # admin-API writes to declarative config files are forbidden.
          CONFIG_WRITER_MATCHES=$(grep -rn --include="*.py" -E "\b(write_config|mutate_config|set_field)\(" src/maxim/ tests/ \
            | grep -vE "^src/maxim/runtime/config_writer\.py:" \
            | grep -vE "^src/maxim/runtime/config_cli\.py:" \
            | grep -vE "^src/maxim/runtime/config_loader\.py:.*written = write_config" \
            | grep -vE "^src/maxim/peer/cli\.py:" \
            | grep -vE "^tests/unit/test_config_writer\.py:" \
            | grep -vE "^tests/unit/test_config_cli\.py:" \
            | grep -vE "^tests/unit/test_config_loader\.py:" \
            | grep -vE "^tests/unit/test_lane_routing_via_config\.py:" \
            | grep -vE "^tests/unit/test_doctor_resolved_config\.py:" \
            | grep -vE "^tests/unit/test_role_unification\.py:" \
            || true)
          if [ -n "$CONFIG_WRITER_MATCHES" ]; then
            echo "ERROR: new caller of config_writer.write_config / mutate_config / set_field detected (config_unification.md IM2)"
            echo "$CONFIG_WRITER_MATCHES"
            exit 1
          fi
          # Post-merge review round 2026-07-26 (Arch #3): the setup verbs
          # (apply_mesh_setup / apply_cloud_setup) are un-grepped WRAPPERS of
          # the writer surface — without their own caller gate any module
          # could mutate config.json through them, silently bypassing the
          # single-writer boundary above. Allow-list: the console's operator-
          # explicit setup endpoints + tests.
          SETUP_VERB_MATCHES=$(grep -rn --include="*.py" -E "\bapply_(mesh|cloud)_setup\(" src/maxim/ tests/ \
            | grep -vE "^src/maxim/runtime/config_writer\.py:" \
            | grep -vE "^src/maxim/console/server\.py:" \
            | grep -vE "^tests/unit/test_config_writer\.py:" \
            | grep -vE "^tests/unit/test_console_server\.py:" \
            | grep -vE "^tests/unit/test_console_launcher_seams\.py:" \
            || true)
          if [ -n "$SETUP_VERB_MATCHES" ]; then
            echo "ERROR: new caller of apply_mesh_setup / apply_cloud_setup detected (single-writer boundary, post-merge round 2026-07-26)"
            echo "$SETUP_VERB_MATCHES"
            echo ""
            echo "runtime/config_writer.py is the only sanctioned writer of"
            echo "~/.config/maxim/config.json. Mirror the mesh_setup.py /"
            echo "write_mesh_config pattern — operator-explicit one-shot"
            echo "setup verbs only; automatic runtime / admin-API writes"
            echo "to declarative config files are forbidden."
            echo ""
            echo "If you have a legitimate new caller (e.g., a new maxim"
            echo "config verb), update both:"
            echo "  1. The allow list in .github/workflows/test.yml"
            echo "  2. The config_writer.py module docstring"
            echo "in the same commit so the rule stays coherent."
            exit 1
          fi
          # config_unification.md cross-confirmed I-3/IM3 fold: inline
          # plaintext API keys must never appear in test fixtures. The
          # repo-wide grep catches sk-/gsk_/AKIA/xoxb- patterns. Only
          # quoted SAMPLE-WITHIN-TEST-CODE matches like
          # `set_field("...remote_api_key_ref", "sk-...")` for testing
          # the rejection path are allowed.
          if grep -rnE '"remote_api_key_ref"[^:]*:\s*"(sk-|gsk_|AKIA|xoxb-)' tests/fixtures/ 2>/dev/null; then
            echo "ERROR: inline plaintext API key in tests/fixtures/ (config_unification.md I-3/IM3)"
            echo ""
            echo "Lane API key references must be file paths or keyring URIs."
            echo "Sample keys for testing rejection paths should be inside"
            echo "test code (tests/unit/), not committed in fixtures."
            exit 1
          fi
          # C6 hard-error allow list (PR #301, 2026-05-29): PainBus /
          # ReactionBus / MemoryHub raw construction without
          # _allow_raw=True now raises TypeError. The keyword survives
          # as the structural opt-out for tests. Production code goes
          # through the canonical builders (build_pain_bus /
          # build_reaction_bus / build_memory_hub) which pass
          # _allow_raw=True internally. The only legitimate src/maxim/
          # production opt-out is DefaultNetwork's raw PainBus
          # construction, deferred to the Wave-2
          # memory_hub_unification follow-on (split-subscriber-ownership
          # fix). New _allow_raw=True production sites are an
          # architectural decision and require explicit allow-list
          # update + CLAUDE.md rationale.
          #
          # Match `_allow_raw=True` ONLY on lines where it appears as a
          # kwarg in a call: at line-start (after indentation), after a
          # comma, or after `(`. This excludes docstring/string text like
          # `"may pass _allow_raw=True"`.
          ALLOW_RAW_MATCHES=$(grep -rnE --include="*.py" "^\s*_allow_raw=True|, _allow_raw=True|\(_allow_raw=True" src/maxim/ \
            | grep -vE "^src/maxim/integration/memory_hub\.py:[0-9]+:        _allow_raw=True," \
            | grep -vE "^src/maxim/proprioception/pain_bus\.py:[0-9]+:            _allow_raw=True," \
            | grep -vE "^src/maxim/reactions/bus\.py:[0-9]+:        _allow_raw=True," \
            | grep -vE "^src/maxim/default_network/network\.py:.*PainBus\(_allow_raw=True\)" \
            || true)
          if [ -n "$ALLOW_RAW_MATCHES" ]; then
            echo "ERROR: new _allow_raw=True opt-out in src/maxim/ detected (v0.9 C6)"
            echo "$ALLOW_RAW_MATCHES"
            echo ""
            echo "Production code MUST go through build_pain_bus / build_reaction_bus /"
            echo "build_memory_hub. The builders pass _allow_raw=True internally."
            echo ""
            echo "If you have a legitimate new opt-out (rare — usually means a"
            echo "deferred Wave-N follow-on like DefaultNetwork's), update BOTH:"
            echo "  1. The allow list in .github/workflows/test.yml"
            echo "  2. CLAUDE.md (the corresponding bus's lesson section)"
            echo "in the same commit, with a TODO(wave-N) comment at the call site."
            echo ""
            echo "See docs/plans/archive/v1_refinement.md §C6 + §1.1-T4 for the deprecation"
            echo "cycle + 1.0 hard-error flip."
            exit 1
          fi
          # v1 C4-followup-1 LLM-spec normalizer rule: any caller of
          # _parse_entity outside the four sanctioned non-LLM input
          # sources (defining/recursive use in embodiment/spec.py,
          # bundled YAML pass-through in component_registry.py,
          # user-authored DM YAML in campaign_runner.py, curated arc
          # data in generative_runner.py) MUST also call
          # normalize_llm_entity_spec on the spec. Bundled + user-YAML
          # sources are AUDITED — they declare `abstract: true`
          # explicitly so the user-migration signal (C4 deprecation
          # warning, 1.0 ConfigurationError) reaches the author. LLM
          # specs are NOT audited — the normalizer auto-fills the
          # missing marker so LLM forgetfulness doesn't crash the
          # imagined / foundry-generated paths.
          #
          # Match `_parse_entity(` calls (excluding the function
          # definition signature) and require either an allow-listed
          # file OR the normalizer on the same line / nearby. Per-file
          # allow-list is the load-bearing structural enforcement;
          # adding a new entry without updating both the allow-list
          # and CLAUDE.md is the canonical "silent-no-op" trap this
          # guard exists to close.
          #
          # See docs/plans/archive/v1_refinement.md §C4 followup-1.
          # Match assignment-form calls only (`x = _parse_entity(`) so
          # docstring/comment mentions like "ready for _parse_entity()"
          # do not false-positive.
          PARSE_ENTITY_MATCHES=$(grep -rnE --include="*.py" "=\s*_parse_entity\(" src/maxim/ \
            | grep -vE "^src/maxim/embodiment/spec\.py:" \
            | grep -vE "^src/maxim/embodiment/component_registry\.py:" \
            | grep -vE "^src/maxim/simulation/campaign_runner\.py:" \
            | grep -vE "^src/maxim/simulation/generative_runner\.py:" \
            | grep -vE "normalize_llm_entity_spec" \
            || true)
          if [ -n "$PARSE_ENTITY_MATCHES" ]; then
            echo "ERROR: new _parse_entity caller outside the C4-followup-1 allow list detected"
            echo "$PARSE_ENTITY_MATCHES"
            echo ""
            echo "LLM-derived entity specs (imagination, foundry, ...) MUST route through"
            echo "maxim.embodiment.spec.normalize_llm_entity_spec(spec) before _parse_entity"
            echo "so the C4 hard-error flip doesn't reject LLM forgetfulness about the"
            echo "modulator.abstract=true marker."
            echo ""
            echo "If you have a legitimate new non-LLM caller (e.g., a new bundled-YAML"
            echo "loader where the user-migration signal should reach the author), update BOTH:"
            echo "  1. The allow list in .github/workflows/test.yml"
            echo "  2. CLAUDE.md (the C4-followup-1 invariant)"
            echo "in the same commit, with a comment naming the input source class."
            echo ""
            echo "See src/maxim/embodiment/spec.py::normalize_llm_entity_spec docstring."
            exit 1
          fi
          # optional_deps single-source-of-truth: a missing optional
          # dependency must not silently degrade behavior. The anti-pattern
          # is `except ImportError:` immediately followed by `<name> = None`
          # (a silent no-op fallback). New code must route through
          # maxim/utils/optional_deps.py — require_optional_dependency (fail
          # loud), optional_dependency_available (capability probe), or
          # warn_optional_fallback (degrade WITH a one-time notice). The
          # allow-list is the set of pre-existing grandfathered sites; most
          # are benign UI fallbacks (rich -> plain). Detects the assignment
          # on the line immediately after the except (grep -A1).
          SILENT_IMPORT_MATCHES=$(grep -rn --include="*.py" -A1 "except ImportError" src/maxim/ \
            | grep -E "[:-][0-9]+[-:][[:space:]]*[A-Za-z_][A-Za-z0-9_.]*[[:space:]]*=[[:space:]]*None\b" \
            | grep -vE "^src/maxim/(cli|comms/api|inference/segment_vision|interactive/prompts|runtime/agent_loop|runtime/agent_pool|similarity/__init__|similarity/ec|tools/internet_search)\.py-" \
            || true)
          if [ -n "$SILENT_IMPORT_MATCHES" ]; then
            echo "ERROR: silent optional-dependency fallback ('except ImportError: X = None')"
            echo "$SILENT_IMPORT_MATCHES"
            echo ""
            echo "Use maxim/utils/optional_deps.py instead of a silent None fallback:"
            echo "  - require_optional_dependency(...)  → fail loud with an install hint"
            echo "  - optional_dependency_available(...) → capability probe (no error)"
            echo "  - warn_optional_fallback(...)        → degrade WITH a one-time notice"
            echo ""
            echo "If a new silent fallback is genuinely benign (e.g. a cosmetic"
            echo "UI fallback), update BOTH:"
            echo "  1. The allow list in .github/workflows/test.yml"
            echo "  2. The optional_deps invariant in CLAUDE.md"
            echo "in the same commit so the rule stays coherent."
            exit 1
          fi
          echo "CI grep invariants clean"

      - name: CI grep invariants (1.0 guard promotion — NAc name, backend imports, raw_proxy_forward, tier names, deleted energy classes)
        run: |
          # CLAUDE.md "NAc class name" lesson: the class is NAc
          # (decisions/nac.py), NOT NucleusAccumbens. A stale reference
          # under `if TYPE_CHECKING:` is silent at runtime (this exact
          # bug shipped in agents/exec_agent.py and lived until the 1.0
          # guard audit found it).
          if grep -rn --include="*.py" "NucleusAccumbens" src/maxim/; then
            echo "ERROR: NucleusAccumbens referenced — the class is NAc (src/maxim/decisions/nac.py)."
            exit 1
          fi
          # CLAUDE.md "LLM access goes through models/language/router.py":
          # concrete backends must not be imported outside models/language/.
          # _MaximPeerBackend is exempt — for_url(...).health_check() is the
          # canonical probe entry point with its own CI-audited call sites.
          # Allow list:
          #   - agents/llm_agent.py: grandfathered — LLMAgent is a
          #     pre-router standalone llama.cpp agent still wired into
          #     simulation_generator/interactive. Migrating it onto the
          #     router is tracked follow-up work, not a drive-by change.
          #   - agents/exec_agent.py: line-scoped to the PROPOSED_GOAL_TOOL
          #     constant import only (a future backend-class import in the
          #     same file still fails).
          # Scope note: matches the `from maxim.models.language.X import`
          # form only (the codebase-wide convention); `import maxim.models.
          # language.X` and relative-import forms are out of scope for this
          # first guard.
          # Positive control: the pattern must keep matching the two
          # allow-listed sites pre-filter — if the regex rots (module
          # rename, import-style migration), fail loudly instead of
          # passing vacuously forever.
          BACKEND_IMPORT_ALL=$(grep -rnE --include="*.py" "from maxim\.models\.language\.(anthropic_backend|llama_backend|openai_backend|transformers_backend) import" src/maxim/ || true)
          if ! echo "$BACKEND_IMPORT_ALL" | grep -q "^src/maxim/agents/llm_agent\.py:"; then
            echo "ERROR: backend-import grep positive control failed — pattern no longer matches the"
            echo "       grandfathered agents/llm_agent.py site. Either llm_agent migrated to the"
            echo "       router (remove it from the allow list + this control) or the regex rotted."
            exit 1
          fi
          BACKEND_IMPORT_MATCHES=$(echo "$BACKEND_IMPORT_ALL" \
            | grep -v "^src/maxim/models/language/" \
            | grep -v "^src/maxim/agents/llm_agent\.py:" \
            | grep -vE "^src/maxim/agents/exec_agent\.py:.*PROPOSED_GOAL_TOOL" \
            || true)
          if [ -n "$BACKEND_IMPORT_MATCHES" ]; then
            echo "ERROR: concrete LLM backend imported outside models/language/"
            echo "$BACKEND_IMPORT_MATCHES"
            echo ""
            echo "Route through models/language/router.py + runtime/lane_backends.BACKEND_CLASSES."
            echo "If genuinely sanctioned, update the allow list here AND the CLAUDE.md invariant."
            exit 1
          fi
          # CLAUDE.md: raw_proxy_forward / raw_proxy_forward_streaming are
          # reserved for leader_proxy._proxy_request ONLY.
          if grep -rn --include="*.py" "raw_proxy_forward" src/maxim/ | grep -vE "^src/maxim/(runtime/leader_proxy|utils/http)\.py:"; then
            echo "ERROR: raw_proxy_forward used outside leader_proxy.py / utils/http.py"
            exit 1
          fi
          # CLAUDE.md "Lane tier names": canonical names are large/medium/
          # small; legacy infer/review/record string literals must not
          # reappear in lane_models.py.
          if grep -nE "\"(infer|review|record)\"|'(infer|review|record)'" src/maxim/runtime/lane_models.py; then
            echo "ERROR: legacy tier-name string literal in lane_models.py (use large/medium/small)"
            exit 1
          fi
          # CLAUDE.md embodiment-tick invariant: Body.evaluate_failures owns
          # the wall-clock drive-drift tick. A second tick_vital_drift call
          # site would double-drift (ed8b187f removed the percepts.py
          # duplicate for exactly this). Only body.py may call it.
          TICK_MATCHES=$(grep -rn --include="*.py" "tick_vital_drift(" src/maxim/ \
            | grep -v "^src/maxim/embodiment/body\.py:" \
            || true)
          if [ -n "$TICK_MATCHES" ]; then
            echo "ERROR: tick_vital_drift called outside embodiment/body.py — double-drift hazard"
            echo "$TICK_MATCHES"
            echo "       The tick lives in Body.evaluate_failures (see the CLAUDE.md embodiment-tick invariant)."
            exit 1
          fi
          # CLAUDE.md cradle Stage 1c: EnergyReactionBridge and
          # MovementEnergyTracker are hard-deleted dead code.
          if grep -rn --include="*.py" "EnergyReactionBridge\|MovementEnergyTracker" src/maxim/; then
            echo "ERROR: deleted energy classes referenced (EnergyReactionBridge/MovementEnergyTracker)"
            exit 1
          fi
          # 2026-08-07 orient workspace-safety fold: raw SDK motion dispatch
          # (mini.goto_target / mini.set_target / mini.look_at_image) is
          # restricted to the two sanctioned primitives — the controller
          # (hardware/reachy/controller.py, clamps + motion lock) and
          # motion/movement.py (move_head: frame composition + rotation
          # clamps; move_antenna). One additional reference is allow-listed:
          # embodied_runtime/movement.py's _enqueue_sdk_look_at (the SDK's
          # own IK-managed look_at path) — since the 2026-08-09 F1
          # retained-axes fold that site binds the SDK fn to a local
          # (sdk_look_at = self.mini.look_at_image) so a wrapper can
          # invalidate the controller's last-commanded stash around the
          # dispatch; both the old direct-enqueue shape and the new binding
          # shape are allow-listed. A new hand-rolled raw dispatch is
          # the motor-destruction failure class (motors 2+3, hardware note
          # in docs/plans/roadmap_1_1_to_1_3.md).
          RAW_SDK_MOTION=$(grep -rnE --include="*.py" "mini\.(goto_target|set_target|look_at_image)" src/maxim/ \
            | grep -v "^src/maxim/hardware/reachy/controller\.py:" \
            | grep -v "^src/maxim/motion/movement\.py:" \
            | grep -vE "^src/maxim/embodied_runtime/movement\.py:[0-9]+: *self\._enqueue_motor\(self\.mini\.look_at_image" \
            | grep -vE "^src/maxim/embodied_runtime/movement\.py:[0-9]+: *sdk_look_at = self\.mini\.look_at_image" \
            | grep -vE "^[^:]+:[0-9]+: *#" \
            || true)
          if [ -n "$RAW_SDK_MOTION" ]; then
            echo "ERROR: raw SDK motion dispatch outside the sanctioned primitives"
            echo "$RAW_SDK_MOTION"
            echo "       Route through ReachyMiniController.goto_target (clamps + lock) or"
            echo "       Selfy.move()'s clamped enqueue. See docs/embodiment/reachy_mini/orient_vocabulary_audit.md."
            exit 1
          fi
          echo "1.0 promoted grep invariants clean"

      - name: CLAUDE.md invariant regression-guard lint (Principle 5)
        run: |
          # Phase C of the regression-guard discipline. Walks CLAUDE.md's
          # "Lessons learned" + "Architectural invariants" sections and
          # enforces that every [engineering] invariant carries a
          # "Regression guard:" reference and every [behavioral] invariant
          # carries a "Roy experiment:" reference. Missing field = visible
          # coverage gap by design — fails CI with line + tag + title.
          #
          # See CLAUDE.md "Working principles for new mechanisms" Principle 5
          # for the format convention.
          python3 scripts/lint_claude_md_invariants.py

      - name: Multi-agent marker lint (Stage 3 of structural invariant tests)
        run: |
          # Diff-scoped lint per docs/plans/archive/structural_invariant_tests.md
          # Stage 3. For each NEW test function on this branch in
          # tests/unit/test_nac*.py / tests/unit/test_hippocampus*.py /
          # tests/integration/test_memory_hub.py (or any test file whose
          # body references per-agent stash fields), require ONE of:
          #   @pytest.mark.multi_agent_modes      # opts into 3-mode parametrization
          #   @pytest.mark.single_agent_only      # explicit opt-out
          # The fixture + tripwire warning live in tests/multi_agent_fixtures.py.
          # See CLAUDE.md L43 (P4 multi-agent rule) for the underlying
          # invariant.
          #
          # The lint is diff-scoped (compares against origin/main) so
          # existing tests are grandfathered; migration is done in a
          # focused sweep, not as a side effect of unrelated PRs.
          git fetch origin main --depth=1 || true
          python3 scripts/lint_multi_agent_marker.py

      - name: No-silent-swallows lint (Stage 4 of measurement_path_fail_loud)
        run: |
          # Two checks per docs/plans/measurement_path_fail_loud.md Stage 4:
          # (1) zero-total bare `except Exception: pass/continue` over the 16
          #     measurement-path files (purged in Stage 1, PR #487 — this
          #     lock keeps them at zero);
          # (2) diff-scoped repo-wide: a branch may not RAISE any src/maxim/
          #     file's swallow count (grandfathered at origin/main's count).
          # Motivating incident: the SCN drive path was dead for months
          # behind exactly one bare-except-swallowed TypeError.
          git fetch origin main --depth=1 || true
          python3 scripts/lint_no_silent_swallows.py

      - name: Harness provenance lint (Exp 42b retraction lesson)
        run: |
          # Any scripts/**/*.py that spawns `maxim` sub-sims must call
          # scripts/_provenance.py::assert_repo_interpreter before its first
          # spawn — a harness that skips it can measure the WRONG CHECKOUT
          # with authoritative-looking JSONL (the Exp 42b retraction).
          # False positives opt out with '# provenance-exempt: <reason>'.
          python3 scripts/lint_harness_provenance.py

  # ── PKG seam — the lean aarch64 (Raspberry Pi) install ────────────────────
  # Two jobs because there are two DISTINCT risks and neither covers the other:
  #   1. a dependency quietly drags in torch/CUDA  → resolution-level, cheap,
  #      every PR;
  #   2. it doesn't actually install on a Pi       → needs a real aarch64 +
  #      glibc-2.36 + CPython-3.11 userland (only this can catch a missing apt
  #      build-dep, which pygobject/pycairo require since they ship no wheels).
  aarch64-resolve:
    name: aarch64 resolve (lean Pi extra, no heavy backends)
    runs-on: ubuntu-latest
    # Healthy runs finish in well under a minute. Bound hosted-runner or apt
    # mirror stalls so one package probe cannot hold a PR open for hours.
    timeout-minutes: 10
    # Least privilege: this job only checks out and resolves dependencies.
    # An explicit block is also what CodeQL's actions/missing-workflow-permissions
    # query requires — without it these jobs raise alerts that BLOCK the merge
    # (the ruleset's code_scanning rule blocks on `alerts_threshold: all`).
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      # uv, NOT pip: `pip --platform` evaluates environment markers against the
      # HOST, so it reports ZERO nvidia-* for a target where CUDA would install
      # (pypa/pip#6117). That is precisely the assertion this job makes, so the
      # pip answer is unsound. uv resolves markers against the TARGET.
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # pygobject/pycairo ship no wheels ANYWHERE, so the resolver must build
      # their metadata from sdist — which needs the same headers a Pi needs.
      # Installing them here also keeps this job honest: it exercises the real
      # prerequisite rather than resolving a set the Pi could not install.
      - name: Sdist metadata build deps (pygobject/pycairo)
        run: |
          sudo apt-get \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 \
            update
          sudo apt-get \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 \
            -o DPkg::Lock::Timeout=60 \
            install -y --no-install-recommends \
            libgirepository1.0-dev libcairo2-dev pkg-config
      - name: Resolve pymaxim[pi] for linux aarch64 / cp311 and assert no torch/CUDA
        run: python3 scripts/check_aarch64_install.py --print-resolved

  aarch64-install:
    name: aarch64 real install smoke (Debian bookworm)
    permissions:
      contents: read
    # Free + GA for public repos since 2025-08-07. Not on every PR: the
    # pygobject/pycairo source builds cost minutes, and the fast resolve job
    # above already guards the common regression.
    runs-on: ubuntu-24.04-arm
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    container:
      image: debian:bookworm-slim   # glibc 2.36 + CPython 3.11 == the Pi 5 target
    steps:
      - uses: actions/checkout@v4
      - name: System build deps (pygobject/pycairo ship no wheels on any platform)
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            python3 python3-venv python3-dev python3-pip \
            gcc pkg-config libgirepository1.0-dev libcairo2-dev ca-certificates
          python3 --version
      - name: Install pymaxim[pi]
        run: |
          python3 -m venv /venv
          /venv/bin/pip install --upgrade pip
          /venv/bin/pip install ".[pi]"
      - name: Assert no heavy backends in the REAL install
        run: |
          /venv/bin/pip list --format=json > installed.json
          python3 scripts/check_aarch64_install.py --from-json installed.json
      - name: Import smoke + install size
        run: |
          /venv/bin/python -c "import maxim; print('maxim', maxim.__version__)"
          du -sh /venv
