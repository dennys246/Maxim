      - name: A fix that touches src/ ships with a test (#519 lesson)
        # Roadmap 1.1.x item 16.2. TWO populations: the PR TITLE — the subject
        # that squash-merges onto main, and the one the score card counts —
        # against the aggregate base...HEAD diff, plus every branch commit.
        # Without PR_TITLE the lint would only see pre-squash subjects, so a PR
        # titled `fix(...)` with `wip` commits would sail through. Opt-out for a
        # genuine no-test fix is a `No-Tests-Reason: <why>` trailer (or
