  tags: [body, minecraft, world, benchmark, exp56, control]
  synonyms: [satiated benchmark body, exp56 satiated body]
  description: |
    Exp 56 satiated-donor control body (the Exp 52/54 satiated pattern,
    verbatim — reachy_mini_infant_satiated is the precedent): identical to
    minecraft_bench — same six world sensors, same eight opaque affordances,
    the SAME entity name minecraft_bench (load-bearing: the name prefixes
