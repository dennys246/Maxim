component:
  name: base_humanoid
  tags: [body, humanoid, generic, foundational, default]
  synonyms: [humanoid body, human body, adventurer, person, character, protagonist, hero, agent body]
  category: bodies
  archetype: humanoid
  description: |
    Generic humanoid body for simulation agents. Provides a minimal but
    functional set of sensors and affordances that let the agent physically
    interact with its environment. This is the default embodiment for sim mode.

entity:
  name: base_humanoid
  entity_type: body
  sensors:
    stamina:
      unit: ratio
      range: [0, 1]
      initial: 1.0
    hunger:
      unit: ratio
      range: [0, 1]
      initial: 0.0
    visibility:
      unit: ratio
      range: [0, 1]
      initial: 0.8
    carrying_weight:
      unit: ratio
      range: [0, 1]
      initial: 0.0
    # Exteroceptive sound localization: head-relative azimuth of the current
    # sound (-1 = left, 0 = centered/front, +1 = right). SIMULATION-ONLY on this
    # generic body — a base_humanoid has no real mic array; the value is
    # world-set by the audio-orient channel (agent_loop §1.16) from the delivered
    # DoA percept so `listen` can read it back and the agent can act on it.
    # reachy_mini's `azimuth` is the genuine hardware one. Capability-driven: any
    # body that declares an `azimuth` root sensor gets the orient behavior — no
    # per-body code. drift_rate 0 (world-set, no auto-return); the centeredness
    # drive + turn affordances are Phase 2.
    azimuth:
      unit: normalized
      range: [-1, 1]
      initial: 0.0
      # Centeredness drive (Phase 2): off-center is mildly aversive, so turning
      # toward the sound (reducing |azimuth|) gives relief → the orient loop is
      # rewarded. Inert unless the audio-orient channel world-sets a non-zero
      # azimuth (default OFF), so non-audio sims are unaffected. pain_scale kept
      # gentle (0.3) vs reachy's 1.0 — a sound off to the side should not
      # register louder than genuine noxious modes (the reachy mis-scale note).
      drive:
        drift_mode: homeostatic
        set_point: 0.0
        drift_rate: 0.0        # world-set, no auto-return (Phase-1 write owns it)
        comfort_band: 0.1      # within ±0.1 = centered enough
        pain_scale: 0.3
  health: derived
  health_weights:
    head: 0.3
    torso: 0.35
    arms: 0.15
    legs: 0.2
  modulators:
    head:
      sensors:
        awareness:
          unit: ratio
          range: [0, 1]
          initial: 0.9
          weight: 0.6
        skull_integrity:
          unit: ratio
          range: [0, 1]
          initial: 1.0
          weight: 0.4
      integrity: weighted_mean
      damage_affinities:
        slash: {skull_integrity: 0.7, awareness: 0.3}
        blunt: {skull_integrity: 0.5, awareness: 0.5}
      affordances:
        look:
          params: {target: str}
          description: "Observe surroundings or examine a specific object"
        listen:
          params: {}
          description: "Attend to the current sound and localize it — reports the head-relative azimuth (-1 left, 0 centered, +1 right) so you can turn toward it."
    # Orient toward a localized sound (Phase 2). Turning reduces the head-
    # relative azimuth toward 0 (centered). SIMULATION model: a discrete turn
    # writes the coupled azimuth shift directly (self_effect); on the real robot
    # the DoA physically re-measures after the head moves. Capability-only
    # modulator — owns no sensors (C4 abstract). The agent picks turn_left when
    # the sound is to its left (azimuth < 0) and turn_right when it's to the
    # right, closing the loop over a few steps (with overshoot near center).
    orient:
      abstract: true
      affordances:
        turn_left:
          params: {}
          self_effect: {azimuth: 0.3}
          description: "Turn to face left (toward a sound on your left; moves azimuth toward center/+)."
        turn_right:
          params: {}
          self_effect: {azimuth: -0.3}
          description: "Turn to face right (toward a sound on your right; moves azimuth toward center/-)."
    torso:
      sensors:
        core_integrity:
          unit: ratio
          range: [0, 1]
          initial: 1.0
      integrity: weighted_mean
      damage_affinities:
        slash: {core_integrity: 1.0}
        blunt: {core_integrity: 1.0}
        fire: {core_integrity: 0.8}
      affordances:
        rest:
          params: {duration: str}
          description: "Rest to recover stamina and health (brief/moderate/long)"
      latent_affordances:
        brace:
          description: "Tense muscles to absorb impact"
          requires: {integrity: 0.1}
    arms:
      sensors:
        grip_strength:
          unit: ratio
          range: [0, 1]
          initial: 1.0
          weight: 0.5
        arm_mobility:
          unit: ratio
          range: [0, 1]
          initial: 1.0
          weight: 0.5
      integrity: weighted_mean
      damage_affinities:
        slash: {arm_mobility: 0.6, grip_strength: 0.4}
        blunt: {grip_strength: 0.7, arm_mobility: 0.3}
      affordances:
        pick_up:
          params: {object: str}
          description: "Pick up an object from the environment"
          requires: {integrity: 0.2}
        drop:
          params: {object: str}
          description: "Drop a carried object"
        use:
          params: {object: str, action: str}
          description: "Use a held or nearby object, or interact with an entity (open, drink, pull, push, read, activate, attack, defend, dodge, throw)"
          requires: {integrity: 0.15}
      latent_affordances:
        block:
          description: "Raise arms to block an incoming blow"
          requires: {integrity: 0.15}
        parry:
          description: "Deflect an attack with a held weapon"
          requires: {integrity: 0.3}
    legs:
      sensors:
        leg_mobility:
          unit: ratio
          range: [0, 1]
          initial: 1.0
      integrity: weighted_mean
      damage_affinities:
        slash: {leg_mobility: 1.0}
        blunt: {leg_mobility: 1.0}
      affordances:
        move:
          params: {direction: str, speed: str}
          description: "Move in a direction (north/south/east/west) at a speed (walk/run/sneak)"
          requires: {integrity: 0.1}
      latent_affordances:
        dodge:
          description: "Dodge sideways to avoid an incoming attack"
          requires: {integrity: 0.2}
        roll:
          description: "Roll away from an area of danger"
          requires: {integrity: 0.3}
    communication:
      abstract: true
      affordances:
        speak:
          params: {message: str}
          description: "Say something out loud to nearby entities"
  failure_modes:
    - name: concussion
      trigger: {field: head.integrity, op: "<", value: 0.2, pain: 0.6}
    - name: exhaustion
      trigger: {field: stamina, op: "<", value: 0.1, pain: 0.4}
    - name: crippled
      trigger: {field: legs.integrity, op: "<", value: 0.15, pain: 0.5}
    - name: injury
      trigger: {field: health, op: "<", value: 0.2, pain: 0.7}
    - name: overburdened
      trigger: {field: carrying_weight, op: ">", value: 0.8, pain: 0.2}
