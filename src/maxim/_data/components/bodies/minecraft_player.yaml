component:
  name: minecraft_player
  category: bodies
  archetype: humanoid
  tags: [body, minecraft, world, player, bridge]
  synonyms: [minecraft body, player body, minecraft avatar]
  description: |
    The Minecraft player body (1.1.4 world seam, docs/plans/world_seam_1_1_4.md
    PR 3). World-state sensors declare `modality: world` — the first body to
    feed the A4-gained, frozen-centroid world channel (which RE-fires L11's
    re-measure trigger when this body first runs; see the L11 note). Every
    world sensor is written by the bridge's MEASURED game snapshots
    (MinecraftWorldBackend world-owns them; the modeled self_effect on those
    keys is filtered on live), so none carries drift (`drift_rate: 0` on the
    drive-bearing ones, no drive on the rest) — the drift loop must never
    fight the writer. `food` additionally carries an entropic hunger-style
    drive and `health` a homeostatic one, so real game state feeds the drive
    system: world-truth pain, the same dual world+interoception pattern as a
    drive-bearing azimuth. Affordance self_effects are the STUB model for
    bridge-less runs; on live the game's readback is the truth.

entity:
  name: minecraft_player
  entity_type: body
  sensors:
    health:
      unit: hp
      range: [0, 40]   # rest (20 hp, full) = midpoint = A4-neutral
      initial: 20
      modality: world
      drive:
        drift_mode: homeostatic
        set_point: 20
        drift_rate: 0.0        # world-owned: the bridge writes truth
        comfort_band: 6.0      # pain below 14 hp
        pain_scale: 0.5
    food:
      unit: points
      range: [0, 40]   # rest (20, full) = midpoint = A4-neutral
      initial: 20
      modality: world
      drive:
        drift_mode: entropic
        drift_direction: down
        drift_rate: 0.0        # world-owned: the game drains it, not the model
        deprivation_threshold: 6.0
        satisfaction_threshold: 16.0
    light_level:
      unit: level
      range: [0, 15]
      initial: 7
      modality: world
    y_altitude:
      unit: blocks
      range: [0, 128]  # rest (surface y~64) = midpoint; y>128 clamps (the lever, applied)
      initial: 64
      modality: world
    nearest_hostile_dist:
      unit: blocks
      range: [0, 128]  # bridge caps at 64 ("beyond horizon") = midpoint; approach descends loud
      initial: 64
      modality: world
    time_of_day:
      unit: ratio
      range: [0, 1]
      initial: 0.0
      modality: world
      # WRAPS at midnight: 0.99 and 0.01 are two game-minutes apart but
      # embed at opposite basis ends (the azimuth-fold lesson family). A
      # sin/cos pair is the fix if adjacent-midnight confusion ever shows
      # in the PR 4 re-measure; kept scalar until measured.
    # ── Minecraft-scale growth (L11 re-measure prereg): the channel must
    # exceed the ~12-sensor safe band for the retirement-grade re-measure
    # — and this is the "maximally embody" intent anyway. 16 world sensors
    # total; the bridge snapshot and FakeBridgeServer emit every one
    # (lockstep-pinned in tests). All bridge-written: no drives, no drift.
    #
    # RANGE PRINCIPLE (D1's lever, applied deliberately — the L11-prereg
    # review round MEASURED the alternative failing): A4's neutral is the
    # range MIDPOINT, so every range below is declared so the sensor's
    # RESTING value sits at ~0.5 normalized — a resting sensor is silent,
    # a departing one shouts. A range wider than the game's observable
    # span (health [0,40] for 20 max hp) is the representational choice
    # that puts "healthy" at neutral; the clamp window is the author's,
    # units stay the sensor's own (the P1 rule). With rest-at-extreme
    # ranges the gained background was maximally loud and a damage event
    # measured cos 0.926 (cannot clear 0.85); re-centered it measured
    # 0.405 — clean separation.
    saturation:
      unit: points
      range: [0, 10]   # game scale caps ~5-20; JS clamps to 10; rest ~5 = midpoint
      initial: 5
      modality: world
    oxygen:
      unit: bubbles
      range: [0, 40]   # rest (20, surfaced) = midpoint; drowning descends loud
      initial: 20
      modality: world
    hostile_count:
      unit: count
      range: [-32, 32] # rest (0 hostiles) = midpoint; the negative half is unobservable by design
      initial: 0
      modality: world
    distance_from_spawn:
      unit: blocks
      range: [-128, 128] # rest (at spawn) = midpoint; wandering shouts
      initial: 0
      modality: world
    speed:
      unit: blocks_per_tick
      range: [-1, 1]   # rest (still) = midpoint
      initial: 0
      modality: world
    on_ground:
      unit: bool
      range: [-1, 3]   # rest (grounded, 1) = midpoint; airborne (0) speaks at w=0.125
      initial: 1
      modality: world
    is_raining:
      unit: bool
      range: [-1, 1]   # rest (clear, 0) = midpoint; rain (1) shouts
      initial: 0
      modality: world
    xp_level:
      unit: levels
      range: [-50, 50] # rest (0) = midpoint; gaining levels shouts
      initial: 0
      modality: world
    nearest_player_dist:
      unit: blocks
      range: [0, 128]  # bridge caps at 64 = midpoint; a nearing player descends loud
      initial: 64
      modality: world
    look_pitch:
      unit: radians
      range: [-1.5708, 1.5708]
      initial: 0
      modality: world
  modulators:
    avatar:
      abstract: true  # capability-only — no sensors (C4)
      affordances:
        move_to:
          params:
            x: float
            z: float
          description: "Pathfind to the given x/z coordinates"
        turn:
          params:
            degrees: float
          description: "Turn the view by the given degrees (positive = left)"
        mine_block:
          params:
            x: float
            y: float
            z: float
          description: "Mine the block at the given coordinates"
        place_block:
          params:
            x: float
            y: float
            z: float
          description: "Place a held block at the given coordinates"
        eat:
          params: {}
          description: "Eat held food"
          self_effect:
            food: 4.0          # stub model only; live readback owns `food`
        attack_nearest:
          params: {}
          description: "Attack the nearest hostile mob"
