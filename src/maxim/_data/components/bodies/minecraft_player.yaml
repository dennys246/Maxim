component:
  name: minecraft_player
  category: bodies
  archetype: humanoid
  tags: [body, minecraft, world, player, bridge]
  synonyms: [minecraft body, player body, minecraft avatar]
  description: |
    The Minecraft player body (1.1.4 world seam, docs/plans/world_seam_1_1_4.md
    PR 3). World-state sensors declare `modality: world` — the first body to
    feed the A4-gained, frozen-centroid world channel (which RE-fires L11's
    re-measure trigger when this body first runs; see the L11 note). Every
    world sensor is written by the bridge's MEASURED game snapshots
    (MinecraftWorldBackend world-owns them; the modeled self_effect on those
    keys is filtered on live), so none carries drift (`drift_rate: 0` on the
    drive-bearing ones, no drive on the rest) — the drift loop must never
    fight the writer. `food` additionally carries an entropic hunger-style
    drive and `health` a homeostatic one, so real game state feeds the drive
    system: world-truth pain, the same dual world+interoception pattern as a
    drive-bearing azimuth. Affordance self_effects are the STUB model for
    bridge-less runs; on live the game's readback is the truth.

entity:
  name: minecraft_player
  entity_type: body
  sensors:
    health:
      unit: hp
      range: [0, 40]   # rest (20 hp, full) = midpoint = A4-neutral
      initial: 20
      modality: world
      drive:
        drift_mode: homeostatic
        set_point: 20
        drift_rate: 0.0        # world-owned: the bridge writes truth
        comfort_band: 6.0      # pain below 14 hp
        pain_scale: 0.5
    food:
      unit: points
      range: [0, 40]   # rest (20, full) = midpoint = A4-neutral
      initial: 20
      modality: world
      drive:
        drift_mode: entropic
        drift_direction: down
        drift_rate: 0.0        # world-owned: the game drains it, not the model
        deprivation_threshold: 6.0
        satisfaction_threshold: 16.0
    light_level:
      unit: level
      range: [0, 15]
      initial: 7
      modality: world
    y_altitude:
      unit: blocks
      range: [0, 128]  # rest (surface y~64) = midpoint; y>128 clamps (the lever, applied)
      initial: 64
      modality: world
    nearest_hostile_dist:
      unit: blocks
      range: [0, 128]  # bridge caps at 64 ("beyond horizon") = midpoint; approach descends loud
      initial: 64
      modality: world
    time_of_day:
      unit: ratio
      range: [0, 1]
      initial: 0.0
      modality: world
      # WRAPS at midnight: 0.99 and 0.01 are two game-minutes apart but
      # embed at opposite basis ends (the azimuth-fold lesson family). A
      # sin/cos pair is the fix if adjacent-midnight confusion ever shows
      # in the PR 4 re-measure; kept scalar until measured.
    # ── Minecraft-scale growth (L11 re-measure prereg): the channel must
    # exceed the ~12-sensor safe band for the retirement-grade re-measure
    # — and this is the "maximally embody" intent anyway. 17 world sensors
    # total (Exp 60 added `is_in_water`); the bridge snapshot and
    # FakeBridgeServer emit every one (lockstep-pinned in tests). All
    # bridge-written truth; `health`/`food`/`oxygen` additionally carry
    # world-owned drives (drift_rate 0 — the game writes the value, the drive
    # only reads it for pain), the rest are drive-less/drift-less.
    #
    # RANGE PRINCIPLE (D1's lever, applied deliberately — the L11-prereg
    # review round MEASURED the alternative failing): A4's neutral is the
    # range MIDPOINT, so every range below is declared so the sensor's
    # RESTING value sits at ~0.5 normalized — a resting sensor is silent,
    # a departing one shouts. A range wider than the game's observable
    # span (health [0,40] for 20 max hp) is the representational choice
    # that puts "healthy" at neutral; the clamp window is the author's,
    # units stay the sensor's own (the P1 rule). With rest-at-extreme
    # ranges the gained background was maximally loud and a damage event
    # measured cos 0.926 (cannot clear 0.85); re-centered it measured
    # 0.405 — clean separation.
    saturation:
      unit: points
      # MEASURED 2026-09-15 (Exp 60 gate (ii), first live run): the game never RESTS at
      # the old midpoint 5 — a fed bot holds 10-20 (the bridge clamps to 10) and a
      # drained bot 0, so with range [0,10] BOTH natural states sat at an extreme and
      # carried gain weight 1.0 as a CONSTANT in every situation. That constant mass
      # alone lifted cos(shore, submerged) from the replayed 0.787 to the measured
      # 0.8502 (> 0.85) and split the underwater cluster. The range principle applied
      # to the measured rest: fed (= the bridge clamp, 10) is the midpoint and silent;
      # hunger drain descends loud, mirroring `health`/`food`. Only this body declares
      # saturation (the Exp 56/57 bench bodies do not) — no persisted substrate is
      # re-encoded by this change. Replay: docs/experiments/data/exp60_saturation_rest_check.py
      range: [0, 20]   # rest = FED (bridge clamp 10) = midpoint; drain 10->0 descends loud
      initial: 10
      modality: world
    oxygen:
      unit: bubbles
      range: [0, 40]   # rest (20, surfaced) = midpoint; drowning descends loud
      initial: 20
      modality: world
      # Exp 60: air-hunger. Oxygen depletion must publish pain (failure mode
      # `drive:oxygen`) so Wire-4 can book drowning-fear onto the underwater
      # cluster BEFORE tissue damage — without this drive, drowning reaches the
      # NAc only as `drive:health` at oxygen=0 (damage onset), which is too late
      # for the anticipatory surfacing the experiment tests. Mirrors `health`
      # (homeostatic, world-owned truth, comfort_band pain below 14 bubbles):
      # pain fires ~5s into a ~15s dive, well before the ~15s drowning-damage
      # onset — the pre-damage anticipation window.
      drive:
        drift_mode: homeostatic
        set_point: 20
        drift_rate: 0.0        # world-owned: the bridge writes the game's air truth
        comfort_band: 6.0      # pain below 14 bubbles (mirrors health)
        pain_scale: 0.5
    hostile_count:
      unit: count
      range: [-32, 32] # rest (0 hostiles) = midpoint; the negative half is unobservable by design
      initial: 0
      modality: world
    distance_from_spawn:
      unit: blocks
      range: [-128, 128] # rest (at spawn) = midpoint; wandering shouts
      initial: 0
      modality: world
    speed:
      unit: blocks_per_tick
      range: [-1, 1]   # rest (still) = midpoint
      initial: 0
      modality: world
    on_ground:
      unit: bool
      range: [-1, 3]   # rest (grounded, 1) = midpoint; airborne (0) speaks at w=0.125
      initial: 1
      modality: world
    is_raining:
      unit: bool
      range: [-1, 1]   # rest (clear, 0) = midpoint; rain (1) shouts
      initial: 0
      modality: world
    is_in_water:
      unit: bool
      # Exp 60: the STABLE underwater cue. `oxygen` alone only separates the
      # underwater cluster at oxygen~0 (= drowning-damage onset) — measured, the
      # whole ~15s pre-damage dive reads as the shore cluster, so anticipation
      # had no distinct cluster to key on. A binary in-water flag ON from dive
      # second 0 makes underwater a distinct cluster through the entire
      # pre-damage window (measured cos(shore, submerged) ~0.79 at full air).
      # Rest (dry, 0) = midpoint (silent); in-water (1) shouts at gain weight 1.0.
      range: [-1, 1]   # mirrors is_raining: rest 0 = midpoint, submerged 1 = loud
      initial: 0
      modality: world
    xp_level:
      unit: levels
      range: [-50, 50] # rest (0) = midpoint; gaining levels shouts
      initial: 0
      modality: world
    nearest_player_dist:
      unit: blocks
      range: [0, 128]  # bridge caps at 64 = midpoint; a nearing player descends loud
      initial: 64
      modality: world
    look_pitch:
      unit: radians
      range: [-1.5708, 1.5708]
      initial: 0
      modality: world
  modulators:
    avatar:
      abstract: true  # capability-only — no sensors (C4)
      affordances:
        move_to:
          params:
            x: float
            z: float
          description: "Pathfind to the given x/z coordinates"
        turn:
          params:
            degrees: float
          description: "Turn the view by the given degrees (positive = left)"
        mine_block:
          params:
            x: float
            y: float
            z: float
          description: "Mine the block at the given coordinates"
        place_block:
          params:
            x: float
            y: float
            z: float
          description: "Place a held block at the given coordinates"
        eat:
          params: {}
          description: "Eat held food"
          self_effect:
            food: 4.0          # stub model only; live readback owns `food`
        attack_nearest:
          params: {}
          description: "Attack the nearest hostile mob"
        flee:
          # Wire 4 (Exp 58): the threat need's consumer on this body — the
          # design-review triple-confirmed DO-NOT-BUILD was that the
          # _DRIVE_TOOL_AFFINITIES["threat"] table matched ZERO affordances
          # here, so learned fear scored nothing. Param-free BY DESIGN:
          # substrate-primary recommend_action emits empty params, so flight
          # must be a fixed action pattern (retreat to the safe spawn
          # anchor), not coordinate navigation.
          params: {}
          description: "Flight response: retreat to the spawn anchor without digging"
        escape_water:
          # Exp 60: the threat need's WATER consumer. `flee` is DEAD in water —
          # mineflayer-pathfinder's move generators hard-return on liquid nodes,
          # so goto throws NoPath from any submerged start. This bypasses the
          # pathfinder with a raw swim-up (jump control) held until the head
          # block is air again. Param-free (substrate-primary emits no params).
          # Named `escape_water` (NOT `surface`) so it substring-matches the
          # EXISTING _DRIVE_TOOL_AFFINITIES["threat"] "escape" keyword without a
          # generic "surface" token that would false-match other bodies'
          # affordances (e.g. alien_xenomorph `climb_surface`) — code-review S2.
          #
          # Surfacing is DELIBERATELY a LEARNED response only: `oxygen` has NO
          # innate corrective need (_DRIVE_CORRECTIVE_NEEDS has no ("oxygen",
          # "threat")), unlike `health`. An innate oxygen→threat reflex would
          # confound Exp 60's anticipatory-LEARNING claim — do not add one.
          params: {}
          description: "Escape drowning: swim straight up to air (bypasses the water-dead pathfinder)"
