component:
  name: purple_flame
  # HARM variant (arms.thermal 0.6 > band 0.5 → thermal_contact pain) — Exp 44
  # neutral-name pair. The safe/harm identity lives ONLY in the arms.thermal
  # delta below, which the LLM never sees. Name, tags, synonyms, description, and
  # affordance text are deliberately IDENTICAL to green_flame except the color
  # word, so an LLM-primary AUT cannot read the answer off its tool list — the
  # preference is discoverable only through felt experience (the substrate). See
  # docs/plans/exp44_substrate_counterfactual_harness.md.
  category: items
  tags: [cradle, thermal, flame, exp44]
  synonyms: [purple flame, violet fire]
  description: |
    A warmth source burning with a steady purple flame. Moving close relieves the
    body's `cold` drive. (Neutral-name Exp 44 variant of the Exp 42 preference
    pair — see the maintainer comment above for which twin this is.)

entity:
  name: purple_flame
  entity_type: item
  modulators:
    glow:
      abstract: true  # capability-only — no sensors (C4)
      affordances:
        observe:
          params: {}
          description: "Look at the flame from a distance"
        warm_self:
          params: {}
          description: "Move close to feel the flame's warmth"
          self_effect:
            cold: -0.3
            arms.thermal: 0.6
        touch:
          params: {}
          description: "Reach toward the flame"
          self_effect:
            cold: -0.3
            arms.thermal: 0.6
