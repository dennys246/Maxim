      initial: 3
    potency:
      unit: ratio
      range: [0, 1]
      initial: 0.8
    viscosity:
      unit: ratio
      range: [0, 1]
      initial: 0.7
  modulators:
    usage:
      affordances:
        drink:
          params: {}
          description: "Drink the purple liquid from the hexagonal glass vial"
        examine:
          params: {}
          description: "Inspect the thick purple liquid in its hexagonal glass container"
  failure_modes:
    - name: empty
      trigger: {field: doses, op: "<=", value: 0, pain: 0.2}
