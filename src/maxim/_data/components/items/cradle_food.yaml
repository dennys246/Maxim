component:
  name: cradle_food
  category: items
  tags: [cradle, food, satisfaction, drive]
  description: |
    A food source. Eating reduces the agent's hunger via self_effect.
    Feeding is UNLIMITED BY DESIGN (D67, resolved 2026-09-04 as option b):
    the `portions` sensor exists but nothing decrements it — implementing
    the decrement would change Exp 52's own twice-revalidated harness. The
    finite-resource mechanic lives where scarcity is the point:
    items/minecraft_bread.yaml (1.1.4 world seam), whose eat affordance
    actually decrements portions via target_effect.

entity:
  name: food_source
  entity_type: consumable
  sensors:
    portions:
      unit: count
      range: [0, 5]
      initial: 5
    freshness:
      unit: ratio
      range: [0, 1]
      initial: 0.9
  modulators:
    nutrition:
      abstract: true  # capability-only — no sensors (C4)
      affordances:
        eat:
          params: {}
          description: "Eat the food to satisfy hunger"
          requires:
            portions: 1
          self_effect:
            hunger: -0.4
